function pcUpdate() {
  var st = percState; /* naissance, sexe, poids, taille : bandeau partagé */
  st.pc = document.getElementById("pc-pc").value;
  saveLs(PERC_LS, st);
  var out = document.getElementById("pc-out");
  if (!out) return;
  var today = new Date().toISOString().slice(0, 10);
  var age = ageDetail(st.dob, st.dom || today);
  var fr = function (v) { return String(v).replace(".", ","); };
  var fz = function (z) { return (z > 0 ? "+" : "") + fr(Math.round(z * 100) / 100); };
  var poids = st.poids ? parseFloat(st.poids.replace(",", ".")) : null;
  var taille = st.taille ? parseFloat(st.taille.replace(",", ".")) : null;

  /* Encart PC : percentile affiché à côté du champ, dès l'encodage */
  var elPc = document.getElementById("nm-p-pc");
  if (elPc) {
    var pcTxt = "";
    if (st.pc && age && !age.over) {
      var pcV = parseFloat(String(st.pc).replace(",", "."));
      if (pcV > 0) {
        if (!st.sexe) pcTxt = "Percentile : sélectionnez M ou F";
        else if (age.days <= 1856) {
          var rp = percResult("hcfa", st.sexe, age.days, pcV, "cm", 0);
          if (rp) pcTxt = "Percentile : <b>" + pctLabel(rp.p) + "</b> (z " + fz(rp.z) + ")";
        } else pcTxt = "— pas de norme PC au-delà de 5 ans (OMS)";
      }
    }
    elPc.innerHTML = pcTxt;
  }

  if (!age) { out.innerHTML = '<div class="warning-box">Renseignez la date de naissance dans le bandeau ci-dessus.</div>'; return; }
  if (age.over) {
    out.innerHTML = '<div class="warning-box">Âge : ' + ageFr(age.days) + ' (' + age.days + ' jours). Au-delà de 19 ans — hors références OMS (2006 : 0–5 ans ; 2007 : 5–19 ans).</div>';
    return;
  }
  if (!poids && !taille) { out.innerHTML = '<div class="warning-box">Encodez le poids et/ou la taille dans le bandeau ci-dessus.</div>'; return; }
  if (!st.sexe) { out.innerHTML = '<div class="warning-box">Sélectionnez le sexe de l\'enfant (M ou F) dans le bandeau ci-dessus — les courbes de croissance sont spécifiques du sexe.</div>'; return; }

  var cut24 = age.days >= 731; /* OMS : taille debout à partir de 24 mois */
  var nomTaille = cut24 ? "Taille" : "Longueur";

  var row = function (nom, val, unit, r, interp, src, withMed) {
    var pTxt;
    if (r && r.p !== null) {
      pTxt = "Percentile : <b>" + pctLabel(r.p) + "</b> <span style=\"color:var(--muted)\">(z " + fz(r.z) + ")</span>" + (src ? " — " + src : "") + (withMed ? " · P50 : " + fr(Math.round(r.med * 10) / 10) + " " + unit : "");
    } else {
      pTxt = '<span style="color:var(--muted)">Percentile : pas de référence à cet âge</span>';
    }
    return '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--border)">' +
      '<span style="font-weight:800;color:var(--deep);min-width:96px">' + nom + '</span>' +
      '<span style="font-weight:700">' + fr(Math.round(val * 100) / 100) + ' ' + unit + '</span>' +
      (r && r.p !== null && interp ? '<span class="badge ' + interp.cls + '">' + interp.txt + '</span>' : "") +
      '<span style="flex:1"></span>' +
      '<span style="font-size:13px;color:var(--deep)">' + pTxt + '</span>' +
      '</div>';
  };

  var html = '<div class="card" style="padding:4px 14px">';
  var r = interpPerc(st.sexe, age.days, poids, taille, null, st.tailleDebout);
  r.items.forEach(function (it) {
    if (it.key === "hcfa") return; /* PC : encart dédié au-dessus */
    var interp = it.r && it.r.p !== null ? percInterpretation(it.key, it.r.z) : null;
    if (it.key === "lhfa") {
      html += row(nomTaille, it.val, it.unit, it.r, interp, "", true);
      /* Case taille debout/couché juste sous la ligne de la taille */
      var corrTxt = !cut24 && st.tailleDebout ? "Correction +0,7 cm appliquée (debout → longueur)"
        : (cut24 && !st.tailleDebout ? "Correction −0,7 cm appliquée (couché → taille)"
        : (cut24 ? "Référence OMS en taille debout" : "Référence OMS en longueur couchée"));
      html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 8px;border-bottom:1px dashed var(--border)">' +
        '<div class="chips" style="margin:0">' +
        '<span class="chip' + (st.tailleDebout === false ? " on" : "") + '" data-mode="L" onclick="pcTailleMode(false)">📏 Couchée (longueur)</span>' +
        '<span class="chip' + (st.tailleDebout ? " on" : "") + '" data-mode="H" onclick="pcTailleMode(true)">📐 Debout (taille)</span>' +
        '</div>' +
        '<span id="pc-taille-note" style="font-size:11.5px;color:var(--muted)">' + corrTxt + '</span>' +
        '</div>';
    } else if (it.key === "bfa") {
      html += row("IMC (BMI)", it.val, it.unit, it.r, interp, "");
      var cuts = "";
      if (it.r && it.r.p !== null) {
        var v1 = lmsFromZ(it.r.L, 1), v2 = lmsFromZ(it.r.L, 2), v3 = lmsFromZ(it.r.L, 3), vm2 = lmsFromZ(it.r.L, -2);
        if (age.days < 1857) {
          cuts = " À cet âge : risque de surpoids si IMC > " + fr(Math.round(v1 * 10) / 10) + " (+1 DS), surpoids si > " + fr(Math.round(v2 * 10) / 10) + " (+2 DS), obésité si > " + fr(Math.round(v3 * 10) / 10) + " (+3 DS), ébagrissement si < " + fr(Math.round(vm2 * 10) / 10) + " (−2 DS).";
        } else {
          cuts = " À cet âge : surpoids si IMC > " + fr(Math.round(v1 * 10) / 10) + " (+1 DS), obésité si > " + fr(Math.round(v2 * 10) / 10) + " (+2 DS), insuffisance pondérale si < " + fr(Math.round(vm2 * 10) / 10) + " (−2 DS).";
        }
      }
      if (it.rec) html += '<div style="font-size:11.5px;color:var(--muted);padding:0 0 8px;margin-top:-4px"><b>Normes OMS :</b> ' + it.rec + cuts + '</div>';
    } else {
      html += row(it.nom, it.val, it.unit, it.r, interp, it.src || "", it.key === "wfa");
    }
  });

  /* Surface corporelle */
  if (poids && taille && poids > 0 && taille > 0) {
    var bsaM = Math.sqrt(poids * taille / 3600);
    var bsaH = 0.024265 * Math.pow(taille, 0.3964) * Math.pow(poids, 0.5378);
    html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0">' +
      '<span style="font-weight:800;color:var(--deep);min-width:96px">Surface corporelle</span>' +
      '<span style="font-weight:700">' + fr(Math.round(bsaM * 100) / 100) + ' m²</span>' +
      '<span style="flex:1"></span>' +
      '<span style="font-size:13px;color:var(--deep)">Mosteller √(P×T/3600) <span style="color:var(--muted)">· Haycock 0,024265 × T^0,3964 × P^0,5378 : ' + fr(Math.round(bsaH * 100) / 100) + ' m²</span></span>' +
      '</div>';
  }
  html += '</div>';
  out.innerHTML = html;
}

/* ================================================================
   Démarrage
================================================================ */
function updateSyncPill() {
  var b = document.getElementById("sync-pill");
  if (!b) return;
  if (b.classList.contains("syncing")) return;
  b.classList.remove("sync-alert");
  var d = parseInt(cfg.syncAlertDays, 10) || 0;
  var age = cfg.lastSync ? (Date.now() - new Date(cfg.lastSync).getTime()) : Infinity;
  if (d > 0 && (cfg.user || "").trim() && (cfg.repo || "").trim() && age > d * 86400000) {
    b.classList.add("sync-alert");
    b.setAttribute("title", "Dernière synchronisation ancienne ou absente — touchez pour synchroniser");
  } else {
    b.setAttribute("title", "Synchroniser (GitHub)");
  }
}
function syncFromTop() {
  var b = document.getElementById("sync-pill");
  if (!(cfg.user || "").trim() || !(cfg.repo || "").trim()) { window.location.hash = "#/reglages/import"; return; }
  if (b && b.classList.contains("syncing")) return;
  if (b) { b.classList.remove("sync-alert"); b.classList.add("syncing"); }
  var last = "";
  syncGitHub(function (m) { last = m; toast(m); }, true).then(function () {
    if (b) b.classList.remove("syncing");
    if (last) toast(last);
    updateSyncPill();
  }).catch(function (e) {
    if (b) b.classList.remove("syncing");
    var msg = (e && e.message) || "";
    if (/load failed|networkerror|failed to fetch/i.test(msg)) msg = "impossible de joindre GitHub (réseau ou page hors ligne). Rechargez la page et vérifiez votre connexion internet.";
    toast("❌ Synchronisation interrompue : " + (msg || "consultez le journal sur Réglages → Importer / Synchroniser."));
    updateSyncPill();
  });
}
function syncFromReglages() {
  window.location.hash = "#/reglages/import";
  setTimeout(runSync, 60);
}
document.addEventListener("keydown", function (e) {
  var tag = (e.target && e.target.tagName) || "";
  var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if (e.key === "/" && !typing) {
    e.preventDefault();
    var s = document.getElementById("search");
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    else { window.location.hash = "#/"; setTimeout(function () { var s2 = document.getElementById("search"); if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); } }, 90); }
  } else if (e.key === "Escape" && !typing) {
    var h = window.location.hash || "#/";
    if (h !== "#/" && h !== "#") window.history.back();
  }
});
window.addEventListener("hashchange", render);
applyTheme(curTheme);
applyFont();
render();
updateCount();
updateSyncPill();
var lastSyncAge = cfg.lastSync ? (Date.now() - new Date(cfg.lastSync).getTime()) : Infinity;
if (cfg.autoSync && (fiches.length === 0 || lastSyncAge > 24 * 3600 * 1000)) {
  var silentLog = function () {};
  syncGitHub(silentLog, true);
}
</script>
