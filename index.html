<title>ZenoBE — Fiches médicaments pédiatriques (CHC)</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #eef7f4; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
    --accent: #0E9488; --accent-soft: #e7f5f1; --border: #dce9e5;
    --g1: #0F766E; --g2: #14B8A6; --deep: #0F766E;
    --ok: #047857; --ok-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb;
    --radius: 14px; --shadow: 0 1px 2px rgba(15,23,42,.05);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  /* ---------- Barre supérieure ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(135deg, var(--g1), var(--accent)); border-bottom: none;
    display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; } .brand .logo-h { height: 42px; width: auto; display: block; }
  /* Bandeau enfant « Normes et mesures » : reste visible sous la topbar en défilant */
  .nm-band {
    position: sticky; top: 62px; z-index: 25;
    box-shadow: 0 6px 14px rgba(15,23,42,.10);
  }
  @media (max-width: 700px) { .nm-band { top: 106px; } } /* topbar sur 2 lignes sur petit écran */
  .brand .logo { font-size: 20px; color: #fff; }
  .nav { display: flex; gap: 4px; }
  .nav a {
    text-decoration: none; color: rgba(255,255,255,.88); font-weight: 600; font-size: 13.5px;
    padding: 7px 12px; border-radius: 10px;
  }
  .nav a:hover { background: rgba(255,255,255,.18); color: #fff; }
  .nav a.on { background: rgba(255,255,255,.24); color: #fff; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .count-pill {
    background: rgba(255,255,255,.2); color: #fff; font-weight: 700;
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
  }
  .act-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent); color: #fff; font-weight: 700;
    font-size: 11.5px; padding: 5px 10px; border-radius: 999px;
    text-decoration: none; border: none; cursor: pointer;
    white-space: nowrap; flex: 0 0 auto; font-family: inherit;
  }
  .act-btn:active { opacity: .75; }
  .act-btn svg { flex: 0 0 auto; }
  .count-pill.sync-alert {
    background: #DC2626;
    animation: sync-alert-pulse 2.4s ease-in-out infinite;
  }
  .count-pill.sync-alert svg { fill: #fff; }
  @keyframes sync-alert-pulse {
    50% { background: #991B1B; }
  }
  .count-pill.syncing {
    background: #fff;
    animation: sync-flash 1.8s ease-in-out infinite;
  }
  .count-pill.syncing svg { fill: var(--g1); }
  @keyframes sync-flash {
    50% { background: var(--g2); }
  }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; }
  /* iOS Safari zoome automatiquement au focus d'un input < 16px → forcer 16px */
  input, select, textarea { font-size: 16px !important; }
  input { max-width: 100%; }
  @media (max-width: 480px) {
    main { padding: 14px 10px 60px; }
    h1 { font-size: 20px; }
    .card { padding: 12px; }
    .nm-band { padding: 6px 10px !important; }
  }
  /* ---------- Composants ---------- */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2.f-section {
    font-size: 15px; text-transform: none; letter-spacing: .2px;
    margin: 22px 0 8px; padding: 9px 14px; background: var(--accent-soft);
    color: #1e3a8a; border-radius: 10px; border-left: 4px solid var(--accent);
  }
  /* ---------- Pictogrammes Zénobe (sections de fiche) ---------- */
  h2.picto-head, h3.picto-head {
    display: flex; align-items: center; gap: 10px;
  }
  h2.picto-head {
    font-size: 14px; text-transform: none; letter-spacing: .2px;
    margin: 16px 0 6px; padding: 4px 12px 4px 8px;
    background: linear-gradient(180deg, var(--g1), var(--accent));
    color: #fff; border-radius: 9px; border-left: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  h2.picto-head { gap: 8px; }
  .picto-head svg.zpicto { width: 21px; height: 21px; flex: 0 0 auto; display: block; }
  .fold-body { display: none; }
  .fold.open > .fold-body { display: block; }
  .fold > .picto-head { cursor: pointer; position: relative; padding-right: 32px; }
  .fold > .picto-head::after {
    content: "›"; position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%); font-size: 22px; color: #fff;
    opacity: .9; transition: transform .18s; line-height: 1;
  }
  .fold.open > .picto-head::after { transform: translateY(-50%) rotate(90deg); }
  @media print { .fold-body { display: block !important; } }
  h3 { font-size: 17px; margin: 18px 0 6px; }
  h4 { font-size: 14.5px; margin: 14px 0 6px; color: #334155; }
  p { margin: 8px 0; }
  ul { margin: 8px 0; padding-left: 22px; }
  li { margin: 3px 0; }
  a { color: var(--accent); }
  code { background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px; padding: 1px 5px; font-size: .9em; }
  hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: #fff; border: 1px solid var(--border); color: var(--ink);
    font-weight: 600; font-size: 13.5px; padding: 9px 14px; border-radius: 10px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--deep); color: #fff; }
  .btn-danger { color: #b91c1c; border-color: #fecaca; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #bfdbfe; border-color: var(--accent); }
  label { display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin: 10px 0 4px; }
  .field-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  /* ---------- Liste des fiches ---------- */
  .searchbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--border); background: #fff; color: #334155;
    font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .theme-btn {
    display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;
    color: var(--ink); background: #fff;
    border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 14px; cursor: pointer;
    font-family: inherit; box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }
  .theme-btn.on { background: var(--accent-soft); color: var(--deep); border-color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tabbar { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabbar button {
    flex: 1; padding: 8px 4px; border: 1.5px solid transparent;
    background: linear-gradient(180deg, var(--g1), var(--accent)); color: #fff; border-radius: 10px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; line-height: 1.25;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,.22);
  }
  .tabbar button.on { background: var(--g2); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .tabbar .zpicto, .sectp .zpicto { width: 17px; height: 17px; flex: 0 0 auto; display: inline-block; }
  .sectp .zpicto { width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; }
  .dropbar {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--accent);
    border-radius: 10px; background: #fff; color: var(--accent);
    font-size: 14px; font-weight: 700; text-align: left; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer;
  }
  .dropbar .arrow { transition: transform .15s ease; }
  .dropbar.open .arrow { transform: rotate(180deg); }
  .droplist {
    border: 1.5px solid var(--accent); border-radius: 10px; overflow: hidden;
    margin-bottom: 14px; background: #fff; max-height: 46vh; overflow-y: auto;
  }
  .dropitem {
    padding: 12px 14px; border-bottom: 1px solid #eef1f5; cursor: pointer;
    font-weight: 700; font-size: 14px; color: inherit;
  }
  .droplist .dropitem:last-child { border-bottom: none; }
  .dropitem:hover, .dropitem:active { background: #f0f5fc; }
  .dropitem.on { background: var(--accent); color: #fff; }
  .dropitem .m { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .dropitem.on .m { color: #dbe7f7; }
  .grid-fiches { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .fiche-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; cursor: pointer; box-shadow: var(--shadow); position: relative;
    transition: transform .08s ease, border-color .08s ease;
  }
  .fiche-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .fiche-card .t { font-weight: 700; font-size: 15px; margin: 0 24px 6px 0; }
  .fiche-card .m { font-size: 12px; color: var(--muted); }
  .fiche-card .star { position: absolute; top: 10px; right: 10px; background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px; }
  .tagchip {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-right: 5px;
  }
  .empty {
    text-align: center; padding: 40px 20px; color: var(--muted);
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  /* ---------- Tableaux de posologie ---------- */
  .tbl-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    background: var(--accent-soft); color: var(--deep); text-align: left; font-size: 12px;
    text-transform: uppercase; letter-spacing: .4px; padding: 9px 10px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td { border-top: 1px solid var(--border); padding: 8px 10px; vertical-align: top; }
  tbody tr:nth-child(even) { background: var(--bg); }
  .hm-tbl { background: var(--card); }
  .hm-tbl tbody tr:nth-child(even) td { background: var(--bg); }
  .hm-tbl td:not(:first-child) { font-weight: 800; color: var(--deep); font-size: 14.5px; }
  .hm-tbl tbody tr.hm-hl td { background: var(--accent-soft); font-weight: 800; color: var(--deep); }
  .hm-tbl tbody tr.hm-hl td:first-child { border-left: 4px solid var(--accent); padding-left: 6px; }
  .hm-tbl tbody tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .b-first { background: var(--ok-soft); color: var(--ok); }
  .b-alt { background: var(--warn-soft); color: var(--warn); }
  .b-relais { background: var(--accent-soft); color: var(--accent); }
  .b-none { background: #f1f5f9; color: var(--muted); }
  /* ---------- Fiche ---------- */
  .fiche-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .fiche-head h1 { flex: 1 1 100%; color: var(--deep); }
  .meta-line { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .back { text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 10px; }
  .back:hover { color: var(--accent); }
  /* ---------- Calculateur ---------- */
/* ---------- Calculateur ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 14px; }
  .kpi { background: var(--accent-soft); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-size: 21px; font-weight: 800; color: var(--deep); }
  .kpi .l { font-size: 11.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .4px; }
  .warning-box { background: var(--warn-soft); border: 1px solid #fde68a; color: #92400e; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-top: 12px; }
  /* ---------- Mode nuit ---------- */
  html.dark { --ok: #34d399; --ok-soft: rgba(52,211,153,.13); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.10); }
  html.dark .btn, html.dark .chip, html.dark .theme-btn, html.dark .dropbar, html.dark .droplist { background: var(--card); }
  html.dark .chip { color: var(--ink); }
  html.dark .chip.on { background: var(--accent); color: #fff; }
  html.dark input[type=text], html.dark input[type=number], html.dark input[type=password], html.dark select, html.dark textarea { background: var(--card); color: var(--ink); }
  html.dark code { background: rgba(255,255,255,.08); }
  html.dark label, html.dark h4 { color: var(--muted); }
  html.dark h2.f-section { color: var(--deep); }
  html.dark .dropitem { border-bottom: 1px solid var(--border); }
  html.dark .dropitem:hover, html.dark .dropitem:active { background: rgba(255,255,255,.06); }
  html.dark .warning-box { border-color: rgba(251,191,36,.35); color: #fcd34d; }
  .formula { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* ---------- Import / GitHub ---------- */
  .log {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: #0f172a; color: #e2e8f0; padding: 12px 14px; border-radius: 10px;
    max-height: 230px; overflow: auto; white-space: pre-wrap; margin-top: 12px; display: none;
  }
  .dropzone {
    border: 2px dashed var(--border); border-radius: 12px; padding: 26px; text-align: center;
    color: var(--muted); cursor: pointer;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .ok-note { color: var(--ok); font-weight: 700; }
  .section-title { font-size: 16px; font-weight: 800; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .page-title { font-size: 21px; font-weight: 800; color: var(--accent); margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .page-sub { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: #fff; font-size: 13.5px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; z-index: 60; display: none;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
  .disclaimer { background: #fff; border: 1px solid #fecaca; color: #7f1d1d; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin: 18px 0; }
  @media print {
    .topbar, .back, .actions, footer, .fiche-actions { display: none !important; }
    body { background: #fff; }
    .card { border: none; box-shadow: none; padding: 0; }
    main { max-width: 100%; padding: 0; }
  }
</style>
</head>

function norm(s) {
  return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function slugify(s) {
  return norm(s).replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "non-classe";
}
function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
var ENTITIES = { lt: "<", gt: ">", quot: '"', nbsp: " ", amp: "&", "#39": "'" };
function decodeEnt(s) {
  return String(s || "").replace(/&(lt|gt|quot|nbsp|amp|#39);/g, function (m, e) { return ENTITIES[e] || m; });
}
function fmtMg(mg) {
  if (mg === null || mg === undefined || isNaN(mg)) return "—";

  var s = String(v).replace(".", ",");
  if (v >= 1000) { s += " mg (" + String(Math.round(v / 100) / 10).replace(".", ",") + " g)"; }
  else { s += " mg"; }
  return s;
}
function fmtUg(ug) {
  if (ug === null || ug === undefined || isNaN(ug)) return "—";

}

/* ================================================================
   Analyse markdown (nouveau format des fiches)
================================================================ */
function normKey(k) { return norm(k).replace(/[^a-z0-9]+/g, "_").replace(/(^_|_$)/g, ""); }

function splitFiche(md) {
  var fm = {}, body = md;
  var m = md.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
  if (m) {
    body = md.slice(m[0].length);
    var lastKey = null;
    var lines = m[1].split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var kv = line.match(/^([A-Za-z0-9_\- ]+?)\s*:\s*(.*)$/);
      if (kv) {
        var k = normKey(kv[1]), v = kv[2].trim();
        if (v === "") { fm[k] = []; }
        else if (/^\[.*\]$/.test(v)) { fm[k] = v.slice(1, -1).split(",").map(function (x) { return x.trim().replace(/^['"]|['"]$/g, ""); }).filter(Boolean); }
        else { fm[k] = v.replace(/^['"]|['"]$/g, ""); }
        lastKey = k;
      } else if (/^\s*-\s+/.test(line) && lastKey) {
        if (!Array.isArray(fm[lastKey])) fm[lastKey] = [];
        fm[lastKey].push(line.replace(/^\s*-\s+/, "").trim().replace(/^['"]|['"]$/g, ""));
      }
    }
  }
  return { fm: fm, body: body };
}

function inlineMd(s) {
  var x = esc(decodeEnt(s));
  x = x.replace(/\\\[(.*?)\\\]/g, "[$1]");
  x = x.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  x = x.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  x = x.replace(/`([^`]+)`/g, "<code>$1</code>");
  x = x.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  x = x.replace(/\[([^\]]+)\]\(\s*(\/?[A-Za-z0-9À-ÿ% . _\-\/]+\.(?:pdf|PDF|xlsx|xls|docx|png|jpg|jpeg))\s*\)/g,
    '<a href="#" class="gh-doc" data-doc="$2">$1 📄</a>');
  x = x.replace(/\[([^\]]+)\]\(\s*(\/?[A-Za-z0-9À-ÿ% . _\-\/]+\.md)\s*\)/g,
    '<a href="#" class="gh-mddoc" data-doc="$2">$1</a>');
  return x;
}

function parseTableRow(line) {
  var s = line.trim();
  if (s.indexOf("|") === 0) s = s.slice(1);
  if (s.lastIndexOf("|") === s.length - 1 && s.length > 0) s = s.slice(0, -1);
  return s.split("|").map(function (c) { return c.trim(); });
}
function isSepRow(cells) {

}

function renderTable(rows) {
  if (!rows.length) return "";
  var head = rows[0];
  var typeIdx = -1;
  for (var h = 0; h < head.length; h++) { if (norm(head[h]) === "type") { typeIdx = h; break; } }
  var html = '<div class="tbl-wrap"><table><thead><tr>';
  for (var a = 0; a < head.length; a++) html += "<th>" + inlineMd(head[a]) + "</th>";
  html += "</tr></thead><tbody>";
  for (var r = 1; r < rows.length; r++) {
    if (isSepRow(rows[r])) continue;
    html += "<tr>";
    for (var c = 0; c < head.length; c++) {
      var cell = rows[r][c] || "";
      if (c === typeIdx) {
        var n = norm(cell);
        var cls = "b-none";
        if (n.indexOf("1er") === 0 || n.indexOf("premier") === 0) cls = "b-first";
        else if (n.indexOf("alt") === 0) cls = "b-alt";

      }
    }
    html += "</tr>";
  }
  html += "</tbody></table></div>";
  return html;
}

function pictoKeyFor(headingText) {
  var t = norm(headingText).replace(/[^a-z0-9]+/g, " ").trim();
  for (var key in ZENOBE_PICTOS) {
    if (t.indexOf(key) === 0) return key;
  }
  return null;
}

function mdToHtml(md, guideMode) {
  var lines = decodeEnt(md).split("\n");
  var out = "", i = 0, fhN = 0;
  while (i < lines.length) {
    var t = lines[i].trim();
    if (!t) { i++; continue; }
    if (t.indexOf("|") === 0) {
      var tbl = [];
      while (i < lines.length && lines[i].trim().indexOf("|") === 0) { tbl.push(parseTableRow(lines[i])); i++; }
      out += renderTable(tbl);
      continue;
    }
    var im = t.match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/);
    if (im) {
      out += '<img alt="' + esc(im[1]) + '" data-glsrc="' + esc(im[2]) + '" style="max-width:100%;border-radius:10px;border:1px solid var(--border);margin:8px 0;display:block">';
      i++; continue;
    }
    var h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      var lvl = h[1].length;
      var pk = pictoKeyFor(h[2]);
      if (!pk && guideMode && lvl === 2) pk = "__section__";
      if (pk) {
        var clean = h[2].replace(/^[^A-Za-z0-9À-ÿ]+/, "").trim();
        out += '<h' + lvl + ' class="picto-head" id="fh-' + (fhN++) + '">' + zenTile(pk === "__section__" ? ZENOBE_SECT_PICTO : ZENOBE_PICTOS[pk], true) +
          "<span>" + inlineMd(clean) + "</span></h" + lvl + ">";
        i++; continue;
      }
      if (lvl === 1) { out += '<h1 id="fh-' + (fhN++) + '">' + inlineMd(h[2]) + "</h1>"; }
      else { out += '<h' + lvl + ' id="fh-' + (fhN++) + '">' + inlineMd(h[2]) + "</h" + lvl + ">"; }
      i++; continue;
    }
    if (/^(-{3,}|\*{3,})$/.test(t)) { out += "<hr/>"; i++; continue; }
    if (/^[-*+]\s+/.test(t)) {
      var items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push("<li>" + inlineMd(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>"); i++;
      }
      out += "<ul>" + items.join("") + "</ul>";
      continue;
    }
    if (t.indexOf(">") === 0) { out += "<blockquote><p>" + inlineMd(t.slice(1).trim()) + "</p></blockquote>"; i++; continue; }
    var para = [t]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\||>)/.test(lines[i].trim()) && !/^\s*[-*+]\s+/.test(lines[i])) {
      para.push(lines[i].trim()); i++;
    }
    out += "<p>" + para.map(inlineMd).join("<br/>") + "</p>";
  }
  return out;
}

/* --- Extraction des schémas de posologie depuis le tableau --- */
function extractPoso(md) {
  var lines = decodeEnt(md).split("\n");
  var schemas = [];
  var head = null, i = 0;
  while (i < lines.length) {
    if (lines[i].trim().indexOf("|") === 0) {
      var rows = [];
      while (i < lines.length && lines[i].trim().indexOf("|") === 0) { rows.push(parseTableRow(lines[i])); i++; }
      if (rows.length > 1) {
        var hd = rows[0].map(norm);
        var idxInd = hd.findIndex(function (c) { return c.indexOf("indication") === 0; });
        var idxDose = hd.findIndex(function (c) { return c.indexOf("dose") === 0; });
        var idxFreq = hd.findIndex(function (c) { return c.indexOf("frequence") === 0; });
        var idxVoie = hd.findIndex(function (c) { return c.indexOf("voie") === 0; });
        if (idxInd >= 0 && idxDose >= 0) {
          for (var r = 1; r < rows.length; r++) {
            if (isSepRow(rows[r])) continue;
            var dose = rows[r][idxDose] || "";
            var info = parseDoseInfo(dose);
            var freqText = idxFreq >= 0 ? (rows[r][idxFreq] || "") : "";
            var mFreqCol = freqText.match(/(\d+)\s*x\s*\/?\s*j/i);
            if (mFreqCol && !info.freq) info.freq = parseInt(mFreqCol[1], 10);
            if (!info.freq) { var mQh = freqText.match(/q\s*(\d+(?:[.,]\d+)?)\s*h/i); if (mQh) { var f24 = Math.round(24 / parseFloat(mQh[1].replace(",", "."))); if (f24 >= 1 && f24 <= 12) info.freq = f24; } }
            schemas.push({
              indication: rows[r][idxInd] || "",
              doseText: dose,
              voie: idxVoie >= 0 ? (rows[r][idxVoie] || "") : "",
              freqText: freqText,
              info: info
            });
          }
        }
      }
    } else { i++; }
  }
  return schemas;
}

function parseDoseInfo(doseStr) {
  var s = decodeEnt(doseStr || "");
  var info = { perDay: null, perDose: null, perM2: false, perRate: false, rateUnit: null, ratePer: null, ugDay: false, ugDose: false, min: null, max: null, freq: null, capMg: null };
  var mDay = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?mg\s*\/\s*kg\s*\/\s*j(?:our)?\b/i);
  var mDose = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?mg\s*\/\s*kg\s*\/\s*(?:dose|prise)\b/i);
  var mM2 = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?mg\s*\/\s*m[²2]\s*(?:\/\s*(j(?:our)?|dose|prise))?/i);
  var mRate = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?(µg|mcg|ug|mg)\s*\/\s*kg\s*\/\s*(h(?:eure)?|min(?:ute)?)\b/i);
  var mUg = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?(µg|mcg|ug)\s*\/\s*kg\s*\/\s*(j(?:our)?|dose|prise)\b/i);
  var mFreq = s.match(/(\d+)\s*x\s*\/?\s*j\b/i);
  var mCap = s.match(/max\.?\s*(\d+(?:[.,]\d+)?)\s*(g|mg)\s*\/?\s*j/i);
  if (mRate) {
    info.perRate = true;
    var ru = mRate[3].toLowerCase();
    info.rateUnit = (ru === "mg") ? "mg" : "µg";
    info.ratePer = /^min/i.test(mRate[4]) ? "min" : "h";
    info.min = parseFloat(mRate[1].replace(",", "."));
    info.max = mRate[2] ? parseFloat(mRate[2].replace(",", ".")) : info.min;
  } else if (mUg) {
    if (/^j/i.test(mUg[4])) { info.ugDay = true; } else { info.ugDose = true; }
    info.min = parseFloat(mUg[1].replace(",", "."));
    info.max = mUg[2] ? parseFloat(mUg[2].replace(",", ".")) : info.min;
  } else if (mDay) {
    info.perDay = true;
    info.min = parseFloat(mDay[1].replace(",", "."));
    info.max = mDay[2] ? parseFloat(mDay[2].replace(",", ".")) : info.min;
  } else if (mDose) {
    info.perDose = true;
    info.min = parseFloat(mDose[1].replace(",", "."));
    info.max = mDose[2] ? parseFloat(mDose[2].replace(",", ".")) : info.min;
  } else if (mM2) {
    info.perM2 = true;
    info.min = parseFloat(mM2[1].replace(",", "."));
    info.max = mM2[2] ? parseFloat(mM2[2].replace(",", ".")) : info.min;
    if (mM2[3] && /dose|prise/i.test(mM2[3])) info.perDose = true;
  }
  if (mFreq) info.freq = parseInt(mFreq[1], 10);
  if (mCap) {
    var cap = parseFloat(mCap[1].replace(",", "."));
    info.capMg = (mCap[2].toLowerCase() === "g") ? cap * 1000 : cap;
  }
  return info;
}

/* ================================================================
   Import d'une fiche (fusion par slug)
================================================================ */
function importMd(filename, md, logFn) {
  var parts = splitFiche(md);
  var fm = parts.fm, body = parts.body;
  var title = fm.titre || fm.title;
  if (typeof title !== "string" || !title.trim()) title = filename.replace(/\.(md|markdown|txt)$/i, "").trim();
  var h1 = body.match(/^#\s+(.+)$/m);
  if ((!fm.titre && !fm.title) && h1 && typeof h1[1] === "string") title = h1[1].trim();
  var slug = slugify(title);
  var tags = [];
  if (Array.isArray(fm.tags)) tags = fm.tags.slice();
  else if (fm.tags) tags = [String(fm.tags)];
  if (fm.categorie) tags.push(String(fm.categorie));
  var fiche = {
    id: slug, slug: slug, title: title, filename: filename,
    tags: tags, author: fm.author || "", created: fm.created || "", updated: fm.updated || "",
    md: body, html: mdToHtml(body), poso: extractPoso(body),
    text: norm(title + " " + tags.join(" ") + " " + body)
  };
  var replaced = false;
  for (var i = 0; i < fiches.length; i++) {
    if (fiches[i].slug === slug) { fiches[i] = fiche; replaced = true; break; }
  }
  if (!replaced) fiches.push(fiche);
  fiches.sort(function (a, b) { return a.title.localeCompare(b.title, "fr"); });
  return { fiche: fiche, replaced: replaced };
}

/* ================================================================
   Synchronisation GitHub
================================================================ */
function ghHeaders(raw) {
  var h = { Accept: raw ? "application/vnd.github.raw" : "application/vnd.github+json" };
  if (cfg.token && cfg.token.trim()) h.Authorization = "Bearer " + cfg.token.trim();
  return h;
}
function ghRawHeaders() {
  /* Avec jeton (dépôt privé), on passe par l'API GitHub, qui accepte le contrôle CORS
     du navigateur ; raw.githubusercontent.com le refuse (erreur « load failed » dans Safari).
     Sans jeton (dépôt public), on reste sur raw : requête simple, sans préflight. */
  if (cfg.token && cfg.token.trim()) return ghHeaders(true);
  return {};
}
/* URL raw (non comptée dans le quota API GitHub) — le jeton Bearer reste requis pour un dépôt privé */
function ghRawUrl(path, branch) {
  var segs = String(path).split("/").map(encodeURIComponent).join("/");
  if (cfg.token && cfg.token.trim())
    return "https://api.github.com/repos/" + encodeURIComponent(cfg.user) + "/" + encodeURIComponent(cfg.repo) +
      "/contents/" + segs + "?ref=" + encodeURIComponent(branch || cfg.branch || "main");
  return "https://raw.githubusercontent.com/" + encodeURIComponent(cfg.user) + "/" + encodeURIComponent(cfg.repo) +
    "/" + encodeURIComponent(branch || cfg.branch || "main") + "/" + segs;
}
/* Télécharge un fichier du dépôt. Avec jeton, l'API contents refuse les fichiers > 1 Mo :
   on retombe alors sur git/blobs (jusqu'à 100 Mo) via le listing du dossier. */
async function ghFetch(path, branch) {
  var r = await fetch(ghRawUrl(path, branch), { headers: ghRawHeaders() });
  if (r.ok || !(cfg.token && cfg.token.trim())) return r;
  var dir = String(path).split("/").slice(0, -1).join("/");
  var file = String(path).split("/").pop();
  var rl = await fetch("https://api.github.com/repos/" + encodeURIComponent(cfg.user) + "/" + encodeURIComponent(cfg.repo) +
    "/contents/" + (dir ? dir.split("/").map(encodeURIComponent).join("/") + "/" : "") +
    "?ref=" + encodeURIComponent(branch || cfg.branch || "main"), { headers: ghHeaders(false) });
  if (!rl.ok) return r;
  var entries = await rl.json(); var sha = null;
  (entries || []).forEach(function (en) { if (en.type === "file" && en.name === file) sha = en.sha; });
  if (!sha) return r;
  return fetch("https://api.github.com/repos/" + encodeURIComponent(cfg.user) + "/" + encodeURIComponent(cfg.repo) +
    "/git/blobs/" + encodeURIComponent(sha), { headers: ghHeaders(true) });
}

async function syncGitHub(logFn, silent) {
  var user = (cfg.user || "").trim(), repo = (cfg.repo || "").trim();
  var branch = (cfg.branch || "main").trim(), folder = (cfg.folder || "").trim();
  if (!user || !repo) { if (!silent) logFn("⚠️ Renseignez au minimum l'utilisateur et le dépôt."); return; }
  logFn("Connexion au dépôt " + user + "/" + repo + " (branche " + branch + ")…");
  var url = "https://api.github.com/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo) +
    "/git/trees/" + encodeURIComponent(branch) + "?recursive=1";
  var r;
  try {
    r = await fetch(url, { headers: ghHeaders(false) });
  } catch (e) {
    logFn("❌ Impossible de joindre GitHub (réseau indisponible, ou aperçu dans un environnement sans réseau). " +
      "Le fichier téléchargé et ouvert depuis votre dossier fonctionne normalement.");
    return;
  }
  if (r.status === 404) { logFn("❌ Dépôt ou branche introuvable. Vérifiez l'utilisateur / dépôt / branche. Un dépôt PRIVÉ requiert un jeton."); return; }
  if (r.status === 401) { logFn("❌ Jeton invalide ou expiré (erreur 401)."); return; }
  if (r.status === 403) { logFn("❌ Quota GitHub épuisé ou jeton sans permission (erreur 403). Sans jeton : 60 requêtes/heure — réessayez plus tard ou ajoutez un jeton dans les réglages avancés."); return; }
  if (!r.ok) { logFn("❌ Erreur GitHub " + r.status); return; }
  var tree = (await r.json()).tree || [];
  var prefix = folder ? folder.replace(/^\/+|\/+$/g, "") + "/" : "";
  var files = tree.filter(function (t) {
    return t.type === "blob" && /\.md$/i.test(t.path) && t.path.indexOf(prefix) === 0 &&
      !/(^|\/)\.obsidian\//.test(t.path) && !/(^|\/)\.git\//.test(t.path);

  if (!files.length) {

    var md = await rr.text();

      var dNew = {};

        try {
          dNew[dFiles[m].path.split("/").pop()] = { path: dFiles[m].path, md: await rdoc.text() };

        persistGuides();
        logFn("✅ " + gok + " fiche(s) guideline synchronisée(s) — " + gFolder);
      }
    }
  } catch (e) { logFn("⚠️ Dossier Guidelines non synchronisé."); }
  logFn("Synchronisation terminée : " + ok + " fiche(s) (" + replaced + " mise(s) à jour)." + (dok ? " " + dok + " fichier(s) Labo/Scores." : "") + (gok ? " " + gok + " fiche(s) guideline." : ""));
  if (ok > 0 && !silent) toast("🔄 " + ok + " fiche(s) synchronisée(s)");

/* ================================================================
   Documents GitHub (PDF etc.) liés dans les fiches
   Convention : [Titre](pdf/mon-document.pdf) — chemin relatif au
   dossier des fiches ; un chemin commençant par / est relatif à la
   racine du dépôt. Le fichier est téléchargé via l'API GitHub avec
   le jeton de la carte 🔄 Synchronisation puis ouvert dans le
   navigateur (aperçu PDF natif).
================================================================ */
function ghDocMime(path) {
  var e = (path.split(".").pop() || "").toLowerCase();
  if (e === "pdf") return "application/pdf";
  if (e === "xlsx") return "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  if (e === "xls") return "application/vnd.ms-excel";
  if (e === "docx") return "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
  if (e === "png") return "image/png";
  if (e === "jpg" || e === "jpeg") return "image/jpeg";
  return "application/octet-stream";
}
/* ---------- Visualiseur de documents intégré ----------
   iOS PWA (mode standalone) ne permet ni window.open ni target=_blank
   sur des URLs blob: — on affiche donc le document DANS l'app via un
   <iframe> plein écran (iOS rend nativement les PDF dans un iframe),
   avec :
   - un bouton ⤴️ Partager (Web Share API avec fichier : feuille de
     partage iOS → Enregistrer dans Fichiers, imprimer, autre app) ;
   - un bouton ⬇️ Télécharger (attribut download) ;
   - un bouton ↗ Ouvrir dans le navigateur (utile sur ordinateur,
     silencieusement sans effet sur iOS PWA). */
function closeGhDocViewer() {
  var ov = document.getElementById("ghdocviewer");
  if (ov) {
    var u = ov.getAttribute("data-url");
    if (u) { try { URL.revokeObjectURL(u); } catch (e) {} }
    ov.remove();
  }
}
function showGhDocViewer(blob, name, mime) {
  closeGhDocViewer();
  var url = URL.createObjectURL(blob);
  var ov = document.createElement("div");
  ov.id = "ghdocviewer";
  ov.setAttribute("data-url", url);
  ov.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#111;display:flex;flex-direction:column;";
  var bar = document.createElement("div");
  bar.style.cssText = "display:flex;align-items:center;gap:6px;padding:10px 10px;background:var(--deep);color:#fff;flex:0 0 auto;";
  var t = document.createElement("div");

  t.style.cssText = "flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
  bar.appendChild(t);
  function btn(txt, title, fn) {
    var b = document.createElement("button");
    b.textContent = txt; b.title = title;
    b.style.cssText = "border:0;border-radius:8px;padding:8px 12px;margin-left:4px;font-size:14px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;";
    b.addEventListener("click", fn);
    bar.appendChild(b);
    return b;
  }
  var file = new File([blob], name, { type: mime });
  var canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  if (canShare) {
    btn("⤴️", "Partager / Enregistrer dans Fichiers", function () {
      navigator.share({ files: [file], title: name }).catch(function () {});
    });
  }
  var dl = document.createElement("a");
  dl.textContent = "⬇️"; dl.title = "Télécharger";
  dl.href = url; dl.download = name;
  dl.style.cssText = "text-decoration:none;border-radius:8px;padding:8px 12px;margin-left:4px;font-size:14px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;";
  bar.appendChild(dl);
  btn("↗", "Ouvrir dans le navigateur", function () {
    var w = window.open(url, "_blank");
    if (!w) toast("⚠️ Non disponible sur iOS en mode app — utilisez ⤴️ ou ⬇️.");
  });
  btn("✕", "Fermer", closeGhDocViewer);
  ov.appendChild(bar);
  var frame = document.createElement("iframe");
  frame.src = url;
  frame.style.cssText = "flex:1;width:100%;border:0;background:#fff;";
  ov.appendChild(frame);
  document.body.appendChild(ov);
  if (!/^application\/pdf|^image\//.test(mime)) {
    toast("📄 Aperçu non affichable dans l'app — utilisez ⤴️ ou ⬇️ pour l'ouvrir.");
  }
}
async function openGhDoc(path, label) {
  var user = (cfg.user || "").trim(), repo = (cfg.repo || "").trim();
  var branch = (cfg.branch || "main").trim(), folder = (cfg.folder || "").trim();
  if (!user || !repo || !cfg.token) { toast("⚠️ Renseignez la carte 🔄 Synchronisation (jeton requis)."); return; }
  var p = path.replace(/^\/+/, "");
  if (path.indexOf("/") !== 0) p = (folder ? folder.replace(/^\/+|\/+$/g, "") + "/" : "") + p;
  toast("📄 Téléchargement de « " + (label || path) + " »…");
  try {
    var r = await ghFetch(p, branch);
    if (r.status === 404) {
      /* Fallback : lister le dossier parent et chercher une correspondance
         insensible à la casse et aux accents (ex. lien "harriet-lane.pdf"
         vs fichier "Harriet Lane.pdf") */
      var dir = p.split("/").slice(0, -1).join("/");
      var file = p.split("/").pop();
      var rd = await fetch("https://api.github.com/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo) +
        "/contents/" + (dir ? dir.split("/").map(encodeURIComponent).join("/") + "/" : "") + "?ref=" + encodeURIComponent(branch),
        { headers: ghHeaders(false) });
      if (rd.ok) {
        var entries = (await rd.json()) || [];
        var norm = function (s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\s_]+/g, "-"); };
        var target = norm(file);
        var hit = null, cands = [];
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].type !== "file") continue;
          cands.push(entries[i].name);
          if (!hit && norm(entries[i].name) === target) hit = entries[i].path;
        }
        if (hit) {
          r = await ghFetch(hit, branch);
          toast("✅ Fichier trouvé : " + hit.split("/").pop());
        } else {
          toast("❌ « " + file + " » introuvable. Fichiers du dossier : " + cands.slice(0, 6).join(", "));
          return;
        }
      } else {
        toast("❌ Document et dossier introuvables dans le dépôt : " + p);
        return;
      }
    }
    if (r.status === 401 || r.status === 403) { toast("❌ Jeton invalide, ou quota GitHub épuisé (erreur " + r.status + ") — réessayez plus tard ou ajoutez un jeton."); return; }
    if (!r.ok) { toast("❌ Erreur GitHub " + r.status); return; }
    var buf = await r.arrayBuffer();
    var blob = new Blob([buf], { type: ghDocMime(p) });
    showGhDocViewer(blob, p.split("/").pop() || "document", ghDocMime(p));
  } catch (e) {
    toast("❌ Réseau indisponible ou document inaccessible.");
  }
}

  if (!a) return;

});

/* ---------- Documents .md liés depuis une fiche (autre dossier GitHub) ----------
   Convention : [Titre](/dossier/document.md) — le document est téléchargé via
   l'API GitHub (jeton de la carte 🔄) et affiché dans l'app comme une page
   Markdown. Si le fichier .md est l'une des fiches déjà synchronisées
   (même nom de fichier), l'app y navigue directement (vue fiche complète,
   calculateur inclus). Le lien fonctionne aussi dans Obsidian (note liée). */
async function openGhMdDoc(path, label) {
  var basename = (path.split("/").pop() || "").toLowerCase();
  var f = fiches.find(function (x) { return (x.filename || "").toLowerCase() === basename; });
  if (f) {
    var ft = "#/fiche/" + f.slug + (glCur ? "?from=" + glCur : "");
    if (window.location.hash === ft) render(); else window.location.hash = ft;
    return;
  }
  var user = (cfg.user || "").trim(), repo = (cfg.repo || "").trim();
  var branch = (cfg.branch || "main").trim(), folder = (cfg.folder || "").trim();
  if (!user || !repo || !cfg.token) { toast("⚠️ Renseignez la carte 🔄 Synchronisation (jeton requis)."); return; }
  var p = path.replace(/^\/+/, "");
  if (path.indexOf("/") !== 0) p = (folder ? folder.replace(/^\/+|\/+$/g, "") + "/" : "") + p;
  toast("📄 Ouverture de « " + (label || path) + " »…");
  try {
    var r = await ghFetch(p, branch);
    if (r.status === 404) { toast("❌ Document .md introuvable dans le dépôt : " + p); return; }
    if (r.status === 401 || r.status === 403) { toast("❌ Jeton invalide, ou quota GitHub épuisé (erreur " + r.status + ") — réessayez plus tard ou ajoutez un jeton."); return; }
    if (!r.ok) { toast("❌ Erreur GitHub " + r.status); return; }
    var md = await r.text();
    var parts = splitFiche(md);
    var fmT = parts.fm.titre || parts.fm.title || "";
    var fmTags = parts.fm.tags || [];
    var isGlDoc = fmTags.some(function (t) { return normKey(t) === "guidelines"; });
    if (fmT && fmTags.length && !isGlDoc) {
      var fres = importMd(basename, md);
      toast("✅ Fiche reconnue : " + fres.fiche.title);
      var fht = "#/fiche/" + fres.fiche.slug + (glCur ? "?from=" + glCur : "");
      if (window.location.hash === fht) render(); else window.location.hash = fht;
      return;
    }
    var h1 = parts.body.match(/^#\s+(.+)$/m);
    var docTitle = (fmT || (h1 ? h1[1].trim() : "") || basename.replace(/\.md$/i, "")).trim();
    var html = '<a href="#" class="back gh-back">← Retour</a>';
    html += '<div class="card"><div class="fiche-head"><h1>' + esc(docTitle) + "</h1></div>";
    html += '<div class="disclaimer">📄 Document lié du dépôt GitHub — affichage lecture seule.</div>';
    html += mdToHtml(parts.body);
    html += "</div>";
    view.innerHTML = html;
    window.scrollTo(0, 0);
  } catch (e) {
    toast("❌ Réseau indisponible ou document inaccessible.");
  }
}

  }

  } else {
    html += '<label>Médicament</label><select id="calc-fiche">';

      html += '<option value="' + f.slug + '"' + (f.slug === preselect ? " selected" : "") + ">" + esc(f.title) + "</option>";

  html += '<div class="grid3" style="margin-top:6px">' +

    '<div><label>Dose</label><div style="display:flex;gap:6px"><input type="number" id="calc-dose" step="any" min="0" style="flex:1"/><select id="calc-unite" style="width:110px;flex:0 0 auto"><option value="mgkg">mg/kg</option><option value="ugkg">µg/kg</option><option value="mgm2">mg/m²</option></select></div></div>' +
    '<div><label>Prises / jour</label><input type="number" id="calc-freq" step="1" min="1"/></div>' +
    "</div>";
  html += '<div class="grid3">' +
    '<div><label>Dose max (mg/j) — optionnel</label><input type="number" id="calc-cap" step="100" min="0"/></div>' +
    '<div><label>Répartition</label><select id="calc-mode"><option value="jour">par jour</option><option value="prise">par prise</option><option value="h">par heure — perfusion continue</option><option value="min">par minute — perfusion continue</option></select></div>' +
    "<div></div></div>";

    '<div><label>Taille (cm) — requise si mg/m²</label><input type="number" id="calc-taille" step="0.5" min="1" placeholder="ex : 95"/></div>' +
    '<div><label>Concentration (mg/mL) — perfusion, optionnel</label><input type="number" id="calc-conc" step="0.1" min="0" placeholder="ex : 1"/></div>' +
    '<div><label>Durée perfusion (h) — optionnel</label><input type="number" id="calc-duree" step="0.5" min="0" placeholder="ex : 24"/></div>' +

function fillSchema() {
  var wrap = document.getElementById("calc-schema-wrap");
  var sel = document.getElementById("calc-fiche");
  var f = fiches.find(function (x) { return x.slug === sel.value; });
  if (!wrap || !f) return;
  var html = '<label>Schéma posologique (issu de la fiche)</label><select id="calc-schema">';
  f.poso.forEach(function (p, idx) {
    html += '<option value="' + idx + '">' + esc(p.indication) + " — " + esc(p.doseText) + "</option>";
  });
  html += "</select>";
  wrap.innerHTML = html;
  var s = document.getElementById("calc-schema");
  s.addEventListener("change", applySchema);
  applySchema();
}

function applySchema() {
  var selF = document.getElementById("calc-fiche"), selS = document.getElementById("calc-schema");
  if (!selF || !selS) return;
  var f = fiches.find(function (x) { return x.slug === selF.value; });
  var p = f.poso[parseInt(selS.value, 10)];
  var iDose = document.getElementById("calc-dose"), iFreq = document.getElementById("calc-freq"),
      iCap = document.getElementById("calc-cap"), iMode = document.getElementById("calc-mode"),
      iUnite = document.getElementById("calc-unite");
  /* Défauts selon le schéma : unité + répartition */
  var unite, par;
  if (p.info.perRate) {
    unite = (p.info.rateUnit === "mg") ? "mgkg" : "ugkg";
    par = (p.info.ratePer === "min") ? "min" : "h";
  } else if (p.info.ugDay || p.info.ugDose) {
    unite = "ugkg";
    par = p.info.ugDay ? "jour" : "prise";
  } else if (p.info.perM2) {
    unite = "mgm2";
    par = p.info.perDose ? "prise" : "jour";
  } else {
    unite = "mgkg";
    par = p.info.perDose ? "prise" : "jour";
  }
  iUnite.dataset.prev = unite;
  iUnite.value = unite;
  iMode.value = par;
  iMode.dataset.prev = par;
  iDose.value = String(p.info.min || "");
  iFreq.value = String(p.info.freq || "");
  iCap.value = String(p.info.capMg || "");
}

/* Conversion de la dose quand l'utilisateur change l'unité */
function convertUnite() {
  var iUnite = document.getElementById("calc-unite");
  var iDose = document.getElementById("calc-dose"), iMode = document.getElementById("calc-mode");
  var avant = iUnite.dataset.prev || iUnite.value;
  var apres = iUnite.value;
  if (avant === apres) return;
  var v = parseFloat((iDose.value || "").replace(",", "."));
  if (!isNaN(v) && v > 0) {
    if (avant === "mgkg" && apres === "ugkg") iDose.value = String(v * 1000);
    else if (avant === "ugkg" && apres === "mgkg") iDose.value = String(Math.round(v / 1000 * 10000) / 10000);
    /* mg/m² : pas de conversion numérique (base différente) */
  }
  if (apres === "mgm2" && (iMode.value === "h" || iMode.value === "min")) {
    iMode.value = "jour";
    toast("mg/m² : répartition ajustée à « par jour » (perfusion en m² non définie)");
  }
  if ((apres === "ugkg" || apres === "mgkg") && (iMode.value === "h" || iMode.value === "min") && avant === "mgm2") {
    iMode.value = "jour";
  }
  iUnite.dataset.prev = apres;
  computeDose();
}

/* Arrondi propre des doses converties */
function roundDoseVal(v) {
  if (!isFinite(v) || v <= 0) return v;
  var r;
  if (v >= 10) r = Math.round(v);
  else if (v >= 1) r = Math.round(v * 10) / 10;
  else r = Math.round(v * 10000) / 10000;
  /* Aimant ergonomique : si le resultat tombe juste EN DESSOUS d un multiple de 5
     (a moins de 2 % de la cible), on l arrondit dessus : 33 x 3 = 99 -> 100.
     Uniquement vers le haut : jamais de reduction de dose. */
  var cible = Math.ceil(r / 5) * 5;
  if (cible > r && cible - r <= 0.02 * cible) r = cible;
  return r;
}

/* Conversion de la dose quand l'utilisateur change la répartition */
function convertRepartition() {
  var iMode = document.getElementById("calc-mode");
  var iDose = document.getElementById("calc-dose"), iFreq = document.getElementById("calc-freq");
  var avant = iMode.dataset.prev || iMode.value;
  var apres = iMode.value;
  if (avant === apres) return;
  var freq = parseInt(iFreq && iFreq.value ? String(iFreq.value).replace(",", ".") : "0", 10);
  /* facteur de conversion : nouvelle dose = ancienne × facteur */
  var facteur = null, besoinFreq = false;
  if (avant === "jour" && apres === "prise") { facteur = freq > 0 ? 1 / freq : null; besoinFreq = true; }
  else if (avant === "prise" && apres === "jour") { facteur = freq > 0 ? freq : null; besoinFreq = true; }
  else if (avant === "jour" && apres === "h") facteur = 1 / 24;
  else if (avant === "h" && apres === "jour") facteur = 24;
  else if (avant === "h" && apres === "min") facteur = 60;
  else if (avant === "min" && apres === "h") facteur = 1 / 60;
  else if (avant === "jour" && apres === "min") facteur = 1 / 1440;
  else if (avant === "min" && apres === "jour") facteur = 1440;
  else if (avant === "prise" && apres === "h") { facteur = freq > 0 ? freq / 24 : null; besoinFreq = true; }
  else if (avant === "h" && apres === "prise") { facteur = freq > 0 ? 24 / freq : null; besoinFreq = true; }
  else if (avant === "prise" && apres === "min") { facteur = freq > 0 ? freq / 1440 : null; besoinFreq = true; }
  else if (avant === "min" && apres === "prise") { facteur = freq > 0 ? 1440 / freq : null; besoinFreq = true; }
  if (facteur === null) {
    /* conversion impossible sans le nombre de prises/jour : on refuse le changement */
    iMode.value = avant;
    toast(besoinFreq ? "⚠️ Indiquez d'abord les prises / jour pour convertir la dose." : "⚠️ Conversion non disponible.");
    return;
  }
  var v = parseFloat((iDose.value || "").replace(",", "."));
  if (!isNaN(v) && v > 0) iDose.value = String(roundDoseVal(v * facteur));
  iMode.dataset.prev = apres;
  computeDose();
}

function calcModeEffectif() {
  var iUnite = document.getElementById("calc-unite"), iMode = document.getElementById("calc-mode");
  if (!iUnite || !iMode) return "jour";
  var unite = iUnite.value, par = iMode.value;
  if (unite === "mgm2") return (par === "prise" ? "m2prise" : "m2jour");
  if (unite === "ugkg") return (par === "jour" ? "ugkgjour" : par === "prise" ? "ugkgdose" : par === "min" ? "ugkgmin" : "ugkgh");
  return (par === "jour" ? "jour" : par === "prise" ? "prise" : par === "min" ? "mgkgmin" : "mgkgh");
}

function computeDose() {
  var w = parseFloat((document.getElementById("calc-poids").value || "").replace(",", "."));
  var tEl = document.getElementById("calc-taille");
  var h = tEl ? parseFloat((tEl.value || "").replace(",", ".")) : NaN;
  var dose = parseFloat((document.getElementById("calc-dose").value || "").replace(",", "."));
  var freq = parseInt(document.getElementById("calc-freq").value || "0", 10);
  var cap = parseFloat((document.getElementById("calc-cap").value || "0").replace(",", "."));
  var mode = calcModeEffectif();
  var out = document.getElementById("calc-result");
  if (!w || w <= 0) { out.innerHTML = '<div class="warning-box">Saisissez le poids du patient.</div>'; return; }
  if (!dose || dose <= 0) { out.innerHTML = '<div class="warning-box">Saisissez la dose.</div>'; return; }
  var isRate = (mode === "ugkgh" || mode === "mgkgh" || mode === "ugkgmin" || mode === "mgkgmin");
  var isUg = (mode === "ugkgjour" || mode === "ugkgdose");
  var perMin = (mode === "ugkgmin" || mode === "mgkgmin");
  var isM2 = (mode === "m2jour" || mode === "m2prise");
  var bsa = null;
  if (isM2) {
    if (!h || h <= 0) { out.innerHTML = '<div class="warning-box">Dose en mg/m² : saisissez aussi la taille du patient (surface corporelle, formule de Mosteller).</div>'; return; }
    bsa = Math.sqrt((w * h) / 3600);
  }
  var daily, perPrise, capped = false;
  var concEl = document.getElementById("calc-conc");
  var conc = concEl ? parseFloat((concEl.value || "").replace(",", ".")) : NaN;
  var mlH = null;
  if (isRate) {
    var rateVal = dose * w * (perMin ? 60 : 1); /* débit horaire, dans l'unité du mode (µg ou mg) */
    var rateMgH = (mode === "ugkgh" || mode === "ugkgmin") ? rateVal / 1000 : rateVal;
    daily = rateMgH * 24;
    perPrise = null;
    if (conc && conc > 0) mlH = rateMgH / conc;
  } else if (isUg) {
    if (mode === "ugkgjour") { daily = dose * w / 1000; perPrise = freq > 0 ? daily / freq : null; }
    else { perPrise = dose * w / 1000; daily = freq > 0 ? perPrise * freq : null; }
  } else if (isM2 && mode === "m2prise") {
    perPrise = dose * bsa;
    daily = freq > 0 ? perPrise * freq : null;
  } else if (isM2) {
    daily = dose * bsa;
    perPrise = freq > 0 ? daily / freq : null;
  } else if (mode === "prise") {
    perPrise = dose * w;
    daily = freq > 0 ? perPrise * freq : null;
  } else {
    daily = dose * w;
    perPrise = freq > 0 ? daily / freq : null;
  }
  if (cap && daily && daily > cap) { daily = cap; capped = true; perPrise = freq > 0 ? daily / freq : null; }
  var unitLabel = isRate ? ((mode === "ugkgh" || mode === "ugkgmin") ? "µg" : "mg") + "/kg/" + (perMin ? "min" : "h")
    : (isUg ? "µg/kg/" + (mode === "ugkgdose" ? "dose" : "jour")
    : (isM2 ? "mg/m²/" + (mode === "m2prise" ? "prise" : "jour") : "mg/kg/" + (mode === "prise" ? "prise" : "jour")));
  var html = '<div class="kpi-row">';
  if (isRate) {
    var rateTxt = (mode === "ugkgh" || mode === "ugkgmin")
      ? String(Math.round(rateVal * 100) / 100).replace(".", ",") + " µg/h (= " + String(Math.round(rateMgH * 1000) / 1000).replace(".", ",") + " mg/h)"
      : fmtMg(rateVal) + "/h";
    html += '<div class="kpi"><div class="v">' + rateTxt + '</div><div class="l">Débit de perfusion</div></div>';
  }
  if (daily !== null) html += '<div class="kpi"><div class="v">' + (isUg ? fmtUg(daily * 1000) : fmtMg(daily)) + '</div><div class="l">Dose totale / jour</div></div>';
  if (!isRate && perPrise !== null) html += '<div class="kpi"><div class="v">' + (isUg ? fmtUg(perPrise * 1000) : fmtMg(perPrise)) + '</div><div class="l">Dose par prise (' + freq + 'x/j)</div></div>';
  html += '<div class="kpi"><div class="v">' + String(dose).replace(".", ",") + " " + unitLabel + '</div><div class="l">Règle appliquée</div></div>';
  if (bsa !== null) html += '<div class="kpi"><div class="v">' + bsa.toFixed(2).replace(".", ",") + ' m²</div><div class="l">Surface corporelle (Mosteller)</div></div>';
  if (isRate && mlH) {
    html += '<div class="kpi"><div class="v">' + String(Math.round(mlH * 100) / 100).replace(".", ",") + ' mL/h</div><div class="l">Débit volumétrique (' + String(conc).replace(".", ",") + ' mg/mL)</div></div>';
    var dEl = document.getElementById("calc-duree");
    var duree = dEl ? parseFloat((dEl.value || "").replace(",", ".")) : 0;
    if (duree && duree > 0) {
      html += '<div class="kpi"><div class="v">' + String(Math.round(mlH * duree * 10) / 10).replace(".", ",") + ' mL</div><div class="l">Volume pour ' + String(duree).replace(".", ",") + ' h</div></div>';
    }
  }
  html += "</div>";
  html += '<p class="formula">' + (isRate
      ? "débit = " + dose + " " + ((mode === "ugkgh" || mode === "ugkgmin") ? "µg" : "mg") + "/kg/" + (perMin ? "min" : "h") + " × " + w + " kg" + (perMin ? " × 60 min/h" : "") + (mlH ? " → " + String(Math.round(mlH * 100) / 100).replace(".", ",") + " mL/h (" + String(conc).replace(".", ",") + " mg/mL)" : "")
      : (isUg ? (mode === "ugkgdose" ? "prise = " : "jour = ") + dose + " µg/kg × " + w + " kg"
      : (isM2 ? (mode === "m2prise" ? "prise = " : "jour = ") + dose + " mg/m² × " + bsa.toFixed(2) + " m² (SC = √(" + w + " kg × " + h + " cm / 3600))"
      : (mode === "prise" ? "prise = " : "jour = ") + dose + " mg/kg × " + w + " kg"))) +
    (capped ? " → plafonné au maximum : " + cap + " mg/j" : "") + "</p>";
  if (capped) html += '<div class="warning-box">⚠️ Dose maximale atteinte : le total journalier est plafonné.</div>';
  out.innerHTML = html;
}

function detectDest(md, filename) {
  var parts = splitFiche(md);
  var fm = parts.fm;
  var hay = [(Array.isArray(fm.tags) ? fm.tags.join(" ") : fm.tags) || "", fm.categorie || "", fm.partie || "", fm.type || "", filename || ""].join(" ");
  var k = normKey(hay);
  if (k.indexOf("medicament") >= 0 || (k.indexOf("med") >= 0 && k.indexOf("medical") < 0)) return "med";
  if (k.indexOf("guideline") >= 0) return "gl";
  if (k.indexOf("norme") >= 0 || k.indexOf("labo") >= 0 || k.indexOf("score") >= 0) return "normes";
  return "med";
}
var DEST_LABEL = { med: "Médicaments", gl: "Guidelines", normes: "Normes (Labo/Scores)" };
function importDoc(filename, md) {
  var name = String(filename).replace(/\.(md|markdown|txt)$/i, "") + ".md";
  var rep = !!DOCS_CACHE.files[name];
  DOCS_CACHE.files[name] = { md: md };
  DOCS_CACHE.ts = Date.now();
  docsPersist();
  return { doc: name, replaced: rep };
}
function importAny(filename, md, dest) {
  if (dest !== "med" && dest !== "gl" && dest !== "normes") dest = detectDest(md, filename);
  var res, where;
  if (dest === "gl") { res = importGuide(filename.replace(/\.(md|markdown|txt)$/i, ".md"), md); persistGuides(); where = "gl"; }
  else if (dest === "normes") { res = importDoc(filename, md); where = "normes"; }
  else { res = importMd(filename, md); persistFiches(); where = "med"; }
  return { dest: where, replaced: res.replaced };
}
function handleFiles(fileList) {
  var files = Array.prototype.slice.call(fileList).filter(function (f) { return /\.(md|markdown|txt)$/i.test(f.name); });
  if (!files.length) { toast("Aucun fichier .md trouvé"); return; }
  var sel = document.getElementById("import-dest");
  var dest = sel ? sel.value : "auto";
  var done = 0, added = 0, byDest = {};
  files.forEach(function (f) {
    var reader = new FileReader();
    reader.onload = function () {
      var res = importAny(f.name, String(reader.result), dest);
      done++;
      if (!res.replaced) added++;
      byDest[res.dest] = (byDest[res.dest] || 0) + 1;
      if (done === files.length) {
        var parts = Object.keys(byDest).map(function (k) { return byDest[k] + " → " + DEST_LABEL[k]; });
        toast((dest === "auto" ? "Import auto : " : "Import : ") + parts.join(" · ") + " (" + added + " ajout, " + (files.length - added) + " maj)");
        renderImport();
      }
    };
    reader.readAsText(f);
  });
}

function importPaste() {
  var md = document.getElementById("paste-area").value.trim();
  var name = document.getElementById("paste-name").value.trim() || "fiche-collee.md";
  if (!md) { toast("Collez d'abord le contenu d'une fiche"); return; }
  if (!/\.md$/i.test(name)) name += ".md";
  var sel = document.getElementById("import-dest");
  var dest = sel ? sel.value : "auto";
  var res = importAny(name, md, dest);
  toast((res.replaced ? "Fiche mise à jour — " : "Fiche ajoutée — ") + DEST_LABEL[res.dest]);
  document.getElementById("paste-area").value = "";
  document.getElementById("paste-name").value = "";
}

function wipeAll() {

  fiches = []; favs = []; recents = [];
  cfg.token = "";
  persistFiches(); persistCfg(); saveLs(LS.fav, favs); saveLs(LS.rec, recents);
  toast("Données effacées");
  render();
}

/* ================================================================
   Biométrie de croissance (OMS 2006)
   Tables LMS officielles OMS (package « anthro » de l'OMS —
   WHO Multicentre Growth Reference Study Group, 2006).
   Méthode LMS : z = ((y/M)^L − 1)/(L·S), percentile = Φ(z).
================================================================ */

function nmDobFr(iso) {
  if (!iso || iso.length !== 10) return "";
  return iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4);
}
function nmDobFormat(txt) {
  var d = String(txt).replace(/\D/g, "").slice(0, 8);
  if (d.length > 4) return d.slice(0, 2) + "/" + d.slice(2, 4) + "/" + d.slice(4);
  if (d.length > 2) return d.slice(0, 2) + "/" + d.slice(2);
  return d;
}
function nmDobIso(txt) {
  var d = String(txt).replace(/\D/g, "");
  if (d.length !== 8) return "";
  var jj = parseInt(d.slice(0, 2), 10), mm = parseInt(d.slice(2, 4), 10), aa = parseInt(d.slice(4), 10);
  if (mm < 1 || mm > 12 || jj < 1 || jj > 31) return "";
  var dt = new Date(aa, mm - 1, jj);
  if (dt.getFullYear() !== aa || dt.getMonth() !== mm - 1 || dt.getDate() !== jj) return "";
  var iso = aa + "-" + String(mm).padStart(2, "0") + "-" + String(jj).padStart(2, "0");
  var today = new Date().toISOString().slice(0, 10);
  if (iso > today) return ""; /* date dans le futur : invalide */
  return iso;
}

  var dobDigits = String(document.getElementById("nm-dob").value).replace(/\D/g, "");

  var dobInvalid = dobDigits.length === 8 && !st.dob;

  var elN = document.getElementById("nm-sex-n");

    var off = "padding:5px 16px;font-weight:800;font-size:14px;cursor:pointer";
    var onN = "padding:5px 10px;font-weight:800;font-size:14px;cursor:pointer;background:var(--accent);color:#fff";
    var offN = "padding:5px 10px;font-weight:800;font-size:14px;cursor:pointer";
    elM.setAttribute("style", st.sexe === "M" ? on : off);
    if (elN) elN.setAttribute("style", st.sexe === "" ? onN : offN);
    elF.setAttribute("style", st.sexe === "F" ? on : off);
  }
  if (!elAge || !elP) return;
  var poids = st.poids ? parseFloat(st.poids.replace(",", ".")) : null;
  var taille = st.taille ? parseFloat(st.taille.replace(",", ".")) : null;
  var today = new Date().toISOString().slice(0, 10);
  var age = ageDetail(st.dob, st.dom || today);
  var fmtZ = function (z) { return (z > 0 ? "+" : "") + fr(Math.round(z * 100) / 100); };
  elAge.textContent = dobInvalid ? "⚠️ date invalide" : (age && !age.over ? ageFr(age.days) : "");
  var pctxt = "", tctxt = "", sctxt = "";
  if (age && !age.over && (poids || taille)) {
    if (poids) {
      if (!st.sexe) pctxt = "Percentile : <span style=\"color:var(--muted)\">sélectionnez M ou F</span>";

        var corrT = 0;
        if (st.tailleDebout !== "" && st.tailleDebout !== null) {

var HL_HPCT = [5, 10, 25, 50, 75, 90, 95];
/* Valeurs TA (P50/P90/P95/P95+12 de PAS et PAD) d'une ligne 19.5/19.6,
   interpolees a la taille mesuree ; renvoie aussi le percentile de taille
   estime et une note si la taille sort du champ de la table. */
function hlBpAt(row, hcm) {
  var h = row.slice(0, 7);
  var series = [row.slice(7, 14), row.slice(14, 21), row.slice(21, 28), row.slice(28, 35), row.slice(35, 42), row.slice(42, 49), row.slice(49, 56), row.slice(56, 63)];
  var i = 0, frac = 0, note = "";
  if (hcm <= h[0]) { i = 0; frac = 0; note = "à la limite inférieure de la table (P5 de taille)"; }
  else if (hcm >= h[6]) { i = 5; frac = 1; note = "à la limite supérieure de la table (P95 de taille)"; }
  else { while (hcm > h[i + 1]) i++; frac = (hcm - h[i]) / (h[i + 1] - h[i]); }
  var hpct = Math.round(HL_HPCT[i] + frac * (HL_HPCT[i + 1] - HL_HPCT[i]));
  var vals = series.map(function (arr) { return Math.round(arr[i] + frac * (arr[i + 1] - arr[i])); });
  return {
    hpct: hpct, note: note,
    s: vals.slice(0, 4), d: vals.slice(4)
  };
}
/* Valeurs a la taille mediane (colonne P50) d'une ligne 19.5/19.6. */
function hlBpMed(row) {
  return {
    s: [row[7 + 3], row[14 + 3], row[21 + 3], row[28 + 3]],
    d: [row[35 + 3], row[42 + 3], row[49 + 3], row[56 + 3]]
  };
}


function hlVitalsBracket(mois) {
  for (var i = 1; i < HL_VITALS.length; i++) {
    if (mois < HL_VITALS[i][2]) return i;
  }
  return HL_VITALS.length - 1;
}
/* Seuils EPALS (PAS normale / limite inferieure) + MAP (Harriet Lane p. 1),
   calcules selon l'age de l'enfant — pas d'interpolation. */
function epalsFormules(mois) {
  var ans = Math.floor(mois / 12);
  var r = { ans: ans, pasNormale: null, pasNormaleTxt: "", pasMin: null, pasMinTxt: "", mapMoy: Math.round(55 + 1.5 * ans), mapMin: Math.round(40 + 1.5 * ans) };
  if (mois <= 1) { r.pasNormale = 60; r.pasNormaleTxt = "> 60 (néonate)"; r.pasMin = 50; r.pasMinTxt = "50 (néonate)"; }
  else if (mois <= 12) { r.pasNormale = 80; r.pasNormaleTxt = "> 80 (1–12 mois)"; r.pasMin = 70; r.pasMinTxt = "70 (1 mois–1 an)"; }
  else if (mois <= 120) { r.pasNormale = 90 + 2 * ans; r.pasNormaleTxt = "90 + 2 × âge(ans)"; r.pasMin = 70 + 2 * ans; r.pasMinTxt = "70 + 2 × âge(ans)"; }
  else { r.pasNormale = 110; r.pasNormaleTxt = "110–130 (> 10 ans)"; r.pasMin = 90; r.pasMinTxt = "90 (> 10 ans)"; }
  return r;
}

  var mois = age.days / 30.4375;

  var kpi = function (l, v, note) {

/* Index de la ligne HL_CBC applicable selon l'âge (jours) et le sexe.
   Retourne -1 si âge inconnu, -2 si > 18 ans. */
function cbcRowFor(days, sexe) {
  if (days == null || isNaN(days)) return -1;
  if (days > 6574) return -2;
  if (days < 2) return 3;
  if (days < 8) return 4;
  if (days < 21) return 5;
  if (days < 46) return 6;
  if (days < 136) return 7;
  if (days < 270) return 8;
  if (days < 731) return 9;
  if (days < 2192) return 10;
  if (days < 4383) return 11;
  return (sexe === "F") ? 13 : 12;
}

================================================================ */
var DOCS_CACHE = loadLs(LS.docs, { folder: null, files: {}, ts: 0 });
function docsPersist() { saveLs(LS.docs, DOCS_CACHE); }
function docsNorm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, ""); }
function docsPartie(fm) { var v = fm && fm.partie; return Array.isArray(v) ? normKey(String(v[0] || "")) : normKey(String(v || "")); }

function docRow(kind, r, last) {

    '<span style="font-size:12.5px;color:var(--muted)">' + esc(r.d) + "</span></span>" +
    '<span style="color:var(--accent);font-size:20px;font-weight:800">\u203a</span></div></a>';
}

function docsShowList(kind) {

  var rows = [];
  for (var i = 0; i < names.length; i++) {

    var part = docsPartie(parts.fm);
    if (part && part !== kind) continue;
    var base = names[i].replace(/\.md$/i, "");
    var t = (parts.fm && typeof parts.fm.titre === "string" && parts.fm.titre.trim()) ? parts.fm.titre.trim() : base;
    var d = (parts.fm && typeof parts.fm.description === "string" && parts.fm.description.trim()) ? parts.fm.description.trim() : "Document « " + base + " »";
    rows.push({ t: t, d: d, href: "#/" + (kind === "labo" ? "laboratoire" : "scores") + "/view/" + encodeURIComponent(names[i]) });
  }
  var html = "";
  for (var j = 0; j < rows.length; j++) html += docRow(kind, rows[j], j === rows.length - 1);
  if (!html) html = '<div class="warning-box">Aucun fichier .md pour cette partie dans le dossier « _7.scores_et_labos » du dépôt. Utilisez la synchronisation générale (🔄) après avoir ajouté vos fichiers.</div>';
  else html = '<div class="card" style="padding:6px 16px">' + html + "</div>";
  list.innerHTML = html;
}

function docsStatus(m) { var s = document.getElementById("docs-status"); if (s) s.innerHTML = m; }

async function docsFetch(kind) {
  var user = (cfg.user || "").trim(), repo = (cfg.repo || "").trim();
  var branch = (cfg.branch || "main").trim();
  if (!user || !repo) { docsStatus("⚠️ Renseignez l'utilisateur et le dépôt dans la carte 🔄 Synchronisation (Réglages)."); return; }
  if (!cfg.token) { docsStatus("⚠️ Jeton GitHub requis (dépôt privé) — carte 🔄 Synchronisation (Réglages)."); return; }
  docsStatus("🔄 Synchronisation depuis GitHub…");
  try {
    var r = await fetch("https://api.github.com/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo) +
      "/contents/?ref=" + encodeURIComponent(branch), { headers: ghHeaders(false) });
    if (r.status === 401 || r.status === 403) { docsStatus("❌ Jeton invalide, ou quota GitHub épuisé (erreur " + r.status + ")."); return; }
    if (r.status === 404) { docsStatus("❌ Dépôt ou branche introuvable."); return; }
    if (!r.ok) { docsStatus("❌ Erreur GitHub " + r.status + "."); return; }
    var entries = await r.json();
    var folder = null;
    for (var i = 0; i < (entries || []).length; i++) {
      if (entries[i].type !== "dir") continue;
      var n = docsNorm(entries[i].name);
      if (n.indexOf("scores") >= 0 && n.indexOf("labo") >= 0) { folder = entries[i].path; break; }
    }
    if (!folder) { docsStatus("❌ Dossier « _7.scores_et_labos » introuvable à la racine du dépôt (" + repo + ")."); return; }
    var rd = await fetch("https://api.github.com/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo) +
      "/contents/" + folder.split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(branch), { headers: ghHeaders(false) });
    if (!rd.ok) { docsStatus("❌ Impossible de lister le dossier " + folder + "."); return; }
    var files = (await rd.json()) || [];
    var newFiles = {}, count = 0;
    for (var j = 0; j < files.length; j++) {
      if (files[j].type !== "file" || !/\.md$/i.test(files[j].name)) continue;
      var rf = await ghFetch(files[j].path, branch);
      if (!rf.ok) { docsStatus("⚠️ Échec : " + files[j].name); continue; }
      newFiles[files[j].name] = { path: files[j].path, md: await rf.text() };
      count++;
    }
    if (!count) { docsStatus("❌ Aucun fichier .md dans " + folder + "."); return; }
    DOCS_CACHE.folder = folder;
    DOCS_CACHE.files = newFiles;
    DOCS_CACHE.ts = Date.now();
    docsPersist();
    docsStatus("✅ " + count + " fichier(s) synchronisé(s) — " + folder + " (affichage hors ligne disponible).");
    docsShowList(kind);
  } catch (e) {
    docsStatus("❌ Réseau indisponible ou GitHub inaccessible — contenu en cache affiché le cas échéant.");
  }
}

async function docsFetchOne(kind, name) {
  var user = (cfg.user || "").trim(), repo = (cfg.repo || "").trim();
  var branch = (cfg.branch || "main").trim();
  var fail = function (m) { var b = document.getElementById("doc-body"); if (b) b.innerHTML = '<div class="warning-box">' + m + '</div>'; };
  if (!user || !repo || !cfg.token) { fail("Jeton GitHub requis — carte 🔄 Synchronisation (Réglages)."); return; }
  try {
    var folder = DOCS_CACHE.folder;
    if (!folder) {
      var rr = await fetch("https://api.github.com/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo) +
        "/contents/?ref=" + encodeURIComponent(branch), { headers: ghHeaders(false) });
      if (!rr.ok) { fail("❌ Accès GitHub impossible (erreur " + rr.status + ")."); return; }
      var es = await rr.json();
      for (var i = 0; i < (es || []).length; i++) {
        if (es[i].type !== "dir") continue;
        var n = docsNorm(es[i].name);
        if (n.indexOf("scores") >= 0 && n.indexOf("labo") >= 0) { folder = es[i].path; break; }
      }
      if (!folder) { fail("❌ Dossier « _7.scores_et_labos » introuvable."); return; }
    }
    var rd = await fetch("https://api.github.com/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo) +
      "/contents/" + folder.split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(branch), { headers: ghHeaders(false) });
    if (!rd.ok) { fail("❌ Impossible de lister le dossier."); return; }
    var files = (await rd.json()) || [];
    var target = docsNorm(name);
    var hit = null;
    for (var j = 0; j < files.length; j++) {
      if (files[j].type !== "file" || !/\.md$/i.test(files[j].name)) continue;
      if (docsNorm(files[j].name) === target) { hit = files[j]; break; }
    }
    if (!hit) { fail("❌ Fichier « " + name + " » introuvable dans " + folder + "."); return; }
    var rf = await fetch(ghRawUrl(hit.path.split("/").map(encodeURIComponent).join("/"), branch), { headers: ghRawHeaders() });
    if (!rf.ok) { fail("❌ Téléchargement impossible (erreur " + rf.status + ")."); return; }
    DOCS_CACHE.folder = folder;
    if (!DOCS_CACHE.files) DOCS_CACHE.files = {};
    DOCS_CACHE.files[hit.name] = { path: hit.path, md: await rf.text() };
    docsPersist();
    docsRenderBody(hit.name);
  } catch (e) {
    fail("❌ Réseau indisponible — réessayez, ou ouvrez une autre page en cache.");
  }
}
