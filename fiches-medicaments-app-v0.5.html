<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="apple-touch-icon" href="zenobe-icon.png" />
<link rel="icon" type="image/png" href="zenobe-icon.png" />
<meta name="apple-mobile-web-app-title" content="Zénobe" />
<title>Zénobe — Fiches Médicaments</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f4f7fb; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
    --accent: #1d4ed8; --accent-soft: #eff6ff; --border: #e2e8f0;
    --ok: #047857; --ok-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb;
    --radius: 14px; --shadow: 0 1px 2px rgba(15,23,42,.05);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  /* ---------- Barre supérieure ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30; background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap;
  }
  .brand { font-weight: 800; color: var(--accent); font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .brand .logo { font-size: 20px; }
  /* ---------- Pictogrammes Zénobe (sections de fiche) ---------- */
  h2.picto-head, h3.picto-head {
    display: flex; align-items: center; gap: 10px;
  }
  h2.picto-head {
    font-size: 15px; text-transform: none; letter-spacing: .2px;
    margin: 22px 0 8px; padding: 7px 14px 7px 10px; background: var(--accent-soft);
    color: #1e3a8a; border-radius: 10px; border-left: 4px solid var(--accent);
  }
  .picto-head svg.zpicto { width: 30px; height: 30px; flex: 0 0 auto; display: block; }
  /* ---------- Marque Zénobe ---------- */
  .brand .brand-logo svg { display: block; }
  .brand .brand-name { color: #B8891F; letter-spacing: 1.5px; }
  .nav { display: flex; gap: 4px; }
  .nav a {
    text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13.5px;
    padding: 7px 12px; border-radius: 10px;
  }
  .nav a:hover { background: var(--accent-soft); color: var(--accent); }
  .nav a.on { background: var(--accent-soft); color: var(--accent); }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .count-pill {
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
  }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; }
  /* ---------- Composants ---------- */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2.f-section {
    font-size: 15px; text-transform: none; letter-spacing: .2px;
    margin: 22px 0 8px; padding: 9px 14px; background: var(--accent-soft);
    color: #1e3a8a; border-radius: 10px; border-left: 4px solid var(--accent);
  }
  h3 { font-size: 17px; margin: 18px 0 6px; }
  h4 { font-size: 14.5px; margin: 14px 0 6px; color: #334155; }
  p { margin: 8px 0; }
  ul { margin: 8px 0; padding-left: 22px; }
  li { margin: 3px 0; }
  a { color: var(--accent); }
  code { background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px; padding: 1px 5px; font-size: .9em; }
  hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: #fff; border: 1px solid var(--border); color: var(--ink);
    font-weight: 600; font-size: 13.5px; padding: 9px 14px; border-radius: 10px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1e40af; color: #fff; }
  .btn-danger { color: #b91c1c; border-color: #fecaca; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #bfdbfe; border-color: var(--accent); }
  label { display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin: 10px 0 4px; }
  .field-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  /* ---------- Liste des fiches ---------- */
  .searchbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--border); background: #fff; color: #334155;
    font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid-fiches { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .fiche-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; cursor: pointer; box-shadow: var(--shadow); position: relative;
    transition: transform .08s ease, border-color .08s ease;
  }
  .fiche-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .fiche-card .t { font-weight: 700; font-size: 15px; margin: 0 24px 6px 0; }
  .fiche-card .m { font-size: 12px; color: var(--muted); }
  .fiche-card .star { position: absolute; top: 10px; right: 10px; background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px; }
  .tagchip {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-right: 5px;
  }
  .empty {
    text-align: center; padding: 40px 20px; color: var(--muted);
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  /* ---------- Tableaux de posologie ---------- */
  .tbl-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    background: #f8fafc; color: #1e40af; text-align: left; font-size: 12px;
    text-transform: uppercase; letter-spacing: .4px; padding: 9px 10px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td { border-top: 1px solid #eef2f7; padding: 8px 10px; vertical-align: top; }
  tbody tr:nth-child(even) { background: #fafcff; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .b-first { background: var(--ok-soft); color: var(--ok); }
  .b-alt { background: var(--warn-soft); color: var(--warn); }
  .b-relais { background: var(--accent-soft); color: var(--accent); }
  .b-none { background: #f1f5f9; color: var(--muted); }
  /* ---------- Fiche ---------- */
  .fiche-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .fiche-head h1 { flex: 1 1 100%; }
  .meta-line { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .back { text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 10px; }
  .back:hover { color: var(--accent); }
  /* ---------- Calculateur ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 14px; }
  .kpi { background: var(--accent-soft); border: 1px solid #bfdbfe; border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-size: 21px; font-weight: 800; color: #1e3a8a; }
  .kpi .l { font-size: 11.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .4px; }
  .warning-box { background: var(--warn-soft); border: 1px solid #fde68a; color: #92400e; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-top: 12px; }
  .formula { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* ---------- Import / GitHub ---------- */
  .log {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: #0f172a; color: #e2e8f0; padding: 12px 14px; border-radius: 10px;
    max-height: 230px; overflow: auto; white-space: pre-wrap; margin-top: 12px; display: none;
  }
  .dropzone {
    border: 2px dashed #bfdbfe; border-radius: 12px; padding: 26px; text-align: center;
    color: var(--muted); cursor: pointer;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .ok-note { color: var(--ok); font-weight: 700; }
  .section-title { font-size: 16px; font-weight: 800; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: #fff; font-size: 13.5px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; z-index: 60; display: none;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
  .disclaimer { background: #fff; border: 1px solid #fecaca; color: #7f1d1d; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin: 18px 0; }
  @media print {
    .topbar, .back, .actions, footer, .fiche-actions { display: none !important; }
    body { background: #fff; }
    .card { border: none; box-shadow: none; padding: 0; }
    main { max-width: 100%; padding: 0; }
  }
</style>
</head>

<div class="topbar">
  <div class="brand"><span class="brand-logo"><svg viewBox="0 0 220 220" width="26" height="26" aria-hidden="true"><rect x="0" y="0" width="220" height="220" rx="48" fill="#1E6FBF"/><rect x="56" y="41" width="108" height="16" rx="8" fill="#FFFFFF"/><rect x="56" y="121" width="108" height="16" rx="8" fill="#FFFFFF"/><path d="M 59 57 L 161 121 L 161 107 L 59 57 Z" fill="#FFFFFF"/></svg></span><span class="brand-name">ZENOBE</span></div>
  <nav class="nav" id="nav">
    <a href="#/" data-r="/">Fiches</a>

    <a href="#/import">Import</a>
  </nav>
  <div class="top-right">
    <span class="count-pill" id="count-pill">0 fiche</span>

<main id="view"></main>
<footer>Zénobe — v0.5 · ⚠️ Outil d'aide à la décision — vérifier chaque posologie avant administration. Les doses calculées sont automatiques et doivent être contrôlées.</footer>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ================================================================
   État et persistance
================================================================ */
var LS = { fiches: "fm.fiches.v2", cfg: "fm.github.v2", fav: "fm.fav.v2", rec: "fm.recents.v2" };

function loadLs(key, fallback) {
  try { var v = window.localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function saveLs(key, val) {
  try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { toast("⚠️ Stockage local saturé — impossible d'enregistrer."); return false; }
}

var fiches = loadLs(LS.fiches, []);
var cfg = loadLs(LS.cfg, { user: "cchtrn-del", repo: "Compendium", branch: "main", folder: "", token: "", autoSync: false, lastSync: null });
var favs = loadLs(LS.fav, []);
var recents = loadLs(LS.rec, []);
var EMBEDDED_FICHES = (window.EMBEDDED_FICHES && window.EMBEDDED_FICHES.length) ? window.EMBEDDED_FICHES : [];
var ui = { q: "", tag: "", favOnly: false };

function persistFiches() { saveLs(LS.fiches, fiches); updateCount(); }
function persistCfg() { saveLs(LS.cfg, cfg); }

/* ================================================================
   Utilitaires
================================================================ */
function norm(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function slugify(s) {
  return norm(s).replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "non-classe";
}
function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
var ENTITIES = { lt: "<", gt: ">", quot: '"', nbsp: " ", amp: "&", "#39": "'" };
function decodeEnt(s) {
  return String(s || "").replace(/&(lt|gt|quot|nbsp|amp|#39);/g, function (m, e) { return ENTITIES[e] || m; });
}
function fmtMg(mg) {
  if (mg === null || mg === undefined || isNaN(mg)) return "—";
  var v = Math.round(mg * 100) / 100;
  var s = String(v).replace(".", ",");
  if (v >= 1000) { s += " mg (" + String(Math.round(v / 100) / 10).replace(".", ",") + " g)"; }
  else { s += " mg"; }
  return s;
}
function fmtUg(ug) {
  if (ug === null || ug === undefined || isNaN(ug)) return "—";
  if (ug >= 1000) return fmtMg(ug / 1000);
  var v = ug >= 1 ? Math.round(ug * 100) / 100 : Math.round(ug * 1000) / 1000;
  return String(v).replace(".", ",") + " µg";
}
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(function () { t.style.display = "none"; }, 2600);
}
function updateCount() {
  document.getElementById("count-pill").textContent = fiches.length + " fiche" + (fiches.length > 1 ? "s" : "");
}

/* ================================================================
   Analyse markdown (nouveau format des fiches)
================================================================ */
function normKey(k) { return norm(k).replace(/[^a-z0-9]+/g, "_").replace(/(^_|_$)/g, ""); }

function splitFiche(md) {
  var fm = {}, body = md;
  var m = md.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
  if (m) {
    body = md.slice(m[0].length);
    var lastKey = null;
    var lines = m[1].split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var kv = line.match(/^([A-Za-z0-9_\- ]+?)\s*:\s*(.*)$/);
      if (kv) {
        var k = normKey(kv[1]), v = kv[2].trim();
        if (v === "") { fm[k] = []; }
        else if (/^\[.*\]$/.test(v)) { fm[k] = v.slice(1, -1).split(",").map(function (x) { return x.trim().replace(/^['"]|['"]$/g, ""); }).filter(Boolean); }
        else { fm[k] = v.replace(/^['"]|['"]$/g, ""); }
        lastKey = k;
      } else if (/^\s*-\s+/.test(line) && lastKey) {
        if (!Array.isArray(fm[lastKey])) fm[lastKey] = [];
        fm[lastKey].push(line.replace(/^\s*-\s+/, "").trim().replace(/^['"]|['"]$/g, ""));
      }
    }
  }
  return { fm: fm, body: body };
}

function inlineMd(s) {
  var x = esc(decodeEnt(s));
  x = x.replace(/\\\[(.*?)\\\]/g, "[$1]");
  x = x.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  x = x.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  x = x.replace(/`([^`]+)`/g, "<code>$1</code>");
  x = x.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return x;
}

function parseTableRow(line) {
  var s = line.trim();
  if (s.indexOf("|") === 0) s = s.slice(1);
  if (s.lastIndexOf("|") === s.length - 1 && s.length > 0) s = s.slice(0, -1);
  return s.split("|").map(function (c) { return c.trim(); });
}
function isSepRow(cells) {
  return cells.length > 0 && cells.every(function (c) { return /^:?-{2,}:?$/.test(c.replace(/\s+/g, "")); });
}

function renderTable(rows) {
  if (!rows.length) return "";
  var head = rows[0];
  var typeIdx = -1;
  for (var h = 0; h < head.length; h++) { if (norm(head[h]) === "type") { typeIdx = h; break; } }
  var html = '<div class="tbl-wrap"><table><thead><tr>';
  for (var a = 0; a < head.length; a++) html += "<th>" + inlineMd(head[a]) + "</th>";
  html += "</tr></thead><tbody>";
  for (var r = 1; r < rows.length; r++) {
    if (isSepRow(rows[r])) continue;
    html += "<tr>";
    for (var c = 0; c < head.length; c++) {
      var cell = rows[r][c] || "";
      if (c === typeIdx) {
        var n = norm(cell);
        var cls = "b-none";
        if (n.indexOf("1er") === 0 || n.indexOf("premier") === 0) cls = "b-first";
        else if (n.indexOf("alt") === 0) cls = "b-alt";
        else if (n.indexOf("relais") === 0) cls = "b-relais";
        html += '<td><span class="badge ' + cls + '">' + inlineMd(cell) + "</span></td>";
      } else {
        html += "<td>" + inlineMd(cell) + "</td>";
      }
    }
    html += "</tr>";
  }
  html += "</tbody></table></div>";
  return html;
}

/* ================================================================
   Charte graphique « Zénobe » — pictogrammes de sections
   Style : tuile bleu médical, trait blanc, un seul accent laiton.
   Un pictogramme remplace l'emoji des en-têtes canoniques des fiches.
================================================================ */
function zenPictoDefs(uid) {
  return '<defs>' +
    '<linearGradient id="zt' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#17497F"/><stop offset="1" stop-color="#1E6FBF"/></linearGradient>' +
    '<linearGradient id="zb' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#E7C55A"/><stop offset="1" stop-color="#B8891F"/></linearGradient>' +
    '</defs>';
}
function zenTile(p) {
  return '<svg class="zpicto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" aria-hidden="true">' +
    zenPictoDefs(p.uid) +
    '<rect x="0" y="0" width="240" height="240" rx="44" fill="url(#zt' + p.uid + ')"/>' +
    p.icon + '</svg>';
}
var ZENOBE_PICTOS = {
  "mode d action": {
    uid: "ma",
    icon: '<g transform="translate(120,120) scale(1.35)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="none"/><path d="M -44 -22 A 49 49 0 0 1 20 -45" stroke="url(#zbma)" stroke-width="7"/><path d="M 20 -58 L 26 -44 L 12 -41 Z" fill="url(#zbma)" stroke="none"/><path d="M 44 22 A 49 49 0 0 1 -20 45" stroke="url(#zbma)" stroke-width="7"/><path d="M -20 58 L -26 44 L -12 41 Z" fill="url(#zbma)" stroke="none"/></g>'
  },
  "noms commerciaux": {
    uid: "nc",
    icon: '<g transform="translate(118,122) scale(1.45)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M -34 -30 L 12 -30 L 36 -6 L -6 38 L -34 10 Z"/><line x1="12" y1="-6" x2="-6" y2="12"/><circle cx="-16" cy="-8" r="6" fill="url(#zbnc)" stroke="none"/></g>'
  },
  "indications et doses": {
    uid: "di",
    icon: '<g transform="translate(120,120) scale(1.35)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-42" x2="0" y2="-16"/><line x1="-38" y1="-34" x2="38" y2="-34"/><path d="M -38 -34 L -50 -6"/><path d="M -50 -6 A 14 14 0 0 0 -26 -6"/><path d="M 38 -34 L 26 -6"/><path d="M 26 -6 A 14 14 0 0 0 50 -6"/><line x1="0" y1="16" x2="0" y2="46"/><circle cx="0" cy="-13" r="5" fill="url(#zbdi)" stroke="none"/></g>'
  },
  "effets secondaires": {
    uid: "es",
    icon: '<g transform="translate(120,120) scale(1.4)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M 0 -46 L 44 32 A 8 8 0 0 1 37 44 L -37 44 A 8 8 0 0 1 -44 32 Z"/><line x1="0" y1="-8" x2="0" y2="18" stroke="url(#zbes)"/><circle cx="0" cy="32" r="4.5" fill="url(#zbes)" stroke="none"/></g>'
  },
  "remarques": {
    uid: "re",
    icon: '<g transform="translate(120,120) scale(1.35)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M -44 -34 A 10 10 0 0 1 -34 -44 L 34 -44 A 10 10 0 0 1 44 -34 L 44 12 A 10 10 0 0 1 34 22 L -12 22 L -32 42 L -32 22 L -34 22 A 10 10 0 0 1 -44 12 Z"/><circle cx="-20" cy="-11" r="4.5" fill="url(#zbre)" stroke="none"/><circle cx="0" cy="-11" r="4.5" fill="url(#zbre)" stroke="none" opacity="0.8"/><circle cx="20" cy="-11" r="4.5" fill="url(#zbre)" stroke="none" opacity="0.6"/></g>'
  },
  "sources": {
    uid: "so",

  }
};
function pictoKeyFor(headingText) {
  var t = norm(headingText).replace(/[^a-z0-9]+/g, " ").trim();
  for (var key in ZENOBE_PICTOS) {
    if (t.indexOf(key) === 0) return key;
  }
  return null;
}

function mdToHtml(md) {
  var lines = decodeEnt(md).split("\n");
  var out = "", i = 0;
  while (i < lines.length) {
    var t = lines[i].trim();
    if (!t) { i++; continue; }
    if (t.indexOf("|") === 0) {
      var tbl = [];
      while (i < lines.length && lines[i].trim().indexOf("|") === 0) { tbl.push(parseTableRow(lines[i])); i++; }
      out += renderTable(tbl);
      continue;
    }
    var h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      var lvl = h[1].length;
      var pk = pictoKeyFor(h[2]);
      if (pk) {
        var clean = h[2].replace(/^[^A-Za-z0-9À-ÿ]+/, "").trim();
        out += '<h' + lvl + ' class="picto-head">' + zenTile(ZENOBE_PICTOS[pk]) +
          "<span>" + inlineMd(clean) + "</span></h" + lvl + ">";
        i++; continue;
      }
      if (lvl === 1) { out += "<h1>" + inlineMd(h[2]) + "</h1>"; }
      else { out += "<h" + lvl + ">" + inlineMd(h[2]) + "</h" + lvl + ">"; }
      i++; continue;
    }
    if (/^(-{3,}|\*{3,})$/.test(t)) { out += "<hr/>"; i++; continue; }
    if (/^[-*+]\s+/.test(t)) {
      var items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push("<li>" + inlineMd(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>"); i++;
      }
      out += "<ul>" + items.join("") + "</ul>";
      continue;
    }
    if (t.indexOf(">") === 0) { out += "<blockquote><p>" + inlineMd(t.slice(1).trim()) + "</p></blockquote>"; i++; continue; }
    var para = [t]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\||>)/.test(lines[i].trim()) && !/^\s*[-*+]\s+/.test(lines[i])) {
      para.push(lines[i].trim()); i++;
    }
    out += "<p>" + para.map(inlineMd).join("<br/>") + "</p>";
  }
  return out;
}

/* --- Extraction des schémas de posologie depuis le tableau --- */
function extractPoso(md) {
  var lines = decodeEnt(md).split("\n");
  var schemas = [];
  var head = null, i = 0;
  while (i < lines.length) {
    if (lines[i].trim().indexOf("|") === 0) {
      var rows = [];
      while (i < lines.length && lines[i].trim().indexOf("|") === 0) { rows.push(parseTableRow(lines[i])); i++; }
      if (rows.length > 1) {
        var hd = rows[0].map(norm);
        var idxInd = hd.findIndex(function (c) { return c.indexOf("indication") === 0; });
        var idxDose = hd.findIndex(function (c) { return c.indexOf("dose") === 0; });
        var idxFreq = hd.findIndex(function (c) { return c.indexOf("frequence") === 0; });
        var idxVoie = hd.findIndex(function (c) { return c.indexOf("voie") === 0; });
        if (idxInd >= 0 && idxDose >= 0) {
          for (var r = 1; r < rows.length; r++) {
            if (isSepRow(rows[r])) continue;
            var dose = rows[r][idxDose] || "";
            var info = parseDoseInfo(dose);
            var freqText = idxFreq >= 0 ? (rows[r][idxFreq] || "") : "";
            var mFreqCol = freqText.match(/(\d+)\s*x\s*\/?\s*j/i);
            if (mFreqCol && !info.freq) info.freq = parseInt(mFreqCol[1], 10);
            if (!info.freq) { var mQh = freqText.match(/q\s*(\d+(?:[.,]\d+)?)\s*h/i); if (mQh) { var f24 = Math.round(24 / parseFloat(mQh[1].replace(",", "."))); if (f24 >= 1 && f24 <= 12) info.freq = f24; } }
            schemas.push({
              indication: rows[r][idxInd] || "",
              doseText: dose,
              voie: idxVoie >= 0 ? (rows[r][idxVoie] || "") : "",
              freqText: freqText,
              info: info
            });
          }
        }
      }
    } else { i++; }
  }
  return schemas;
}

function parseDoseInfo(doseStr) {
  var s = decodeEnt(doseStr || "");
  var info = { perDay: null, perDose: null, perM2: false, perRate: false, rateUnit: null, ratePer: null, ugDay: false, ugDose: false, min: null, max: null, freq: null, capMg: null };
  var mDay = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?mg\s*\/\s*kg\s*\/\s*j(?:our)?\b/i);
  var mDose = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?mg\s*\/\s*kg\s*\/\s*(?:dose|prise)\b/i);
  var mM2 = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?mg\s*\/\s*m[²2]\s*(?:\/\s*(j(?:our)?|dose|prise))?/i);
  var mRate = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?(µg|mcg|ug|mg)\s*\/\s*kg\s*\/\s*(h(?:eure)?|min(?:ute)?)\b/i);
  var mUg = s.match(/(\d+(?:[.,]\d+)?)\s*(?:[-–]\s*(\d+(?:[.,]\d+)?)\s*)?(µg|mcg|ug)\s*\/\s*kg\s*\/\s*(j(?:our)?|dose|prise)\b/i);
  var mFreq = s.match(/(\d+)\s*x\s*\/?\s*j\b/i);
  var mCap = s.match(/max\.?\s*(\d+(?:[.,]\d+)?)\s*(g|mg)\s*\/?\s*j/i);
  if (mRate) {
    info.perRate = true;
    var ru = mRate[3].toLowerCase();
    info.rateUnit = (ru === "mg") ? "mg" : "µg";
    info.ratePer = /^min/i.test(mRate[4]) ? "min" : "h";
    info.min = parseFloat(mRate[1].replace(",", "."));
    info.max = mRate[2] ? parseFloat(mRate[2].replace(",", ".")) : info.min;
  } else if (mUg) {
    if (/^j/i.test(mUg[4])) { info.ugDay = true; } else { info.ugDose = true; }
    info.min = parseFloat(mUg[1].replace(",", "."));
    info.max = mUg[2] ? parseFloat(mUg[2].replace(",", ".")) : info.min;
  } else if (mDay) {
    info.perDay = true;
    info.min = parseFloat(mDay[1].replace(",", "."));
    info.max = mDay[2] ? parseFloat(mDay[2].replace(",", ".")) : info.min;
  } else if (mDose) {
    info.perDose = true;
    info.min = parseFloat(mDose[1].replace(",", "."));
    info.max = mDose[2] ? parseFloat(mDose[2].replace(",", ".")) : info.min;
  } else if (mM2) {
    info.perM2 = true;
    info.min = parseFloat(mM2[1].replace(",", "."));
    info.max = mM2[2] ? parseFloat(mM2[2].replace(",", ".")) : info.min;
    if (mM2[3] && /dose|prise/i.test(mM2[3])) info.perDose = true;
  }
  if (mFreq) info.freq = parseInt(mFreq[1], 10);
  if (mCap) {
    var cap = parseFloat(mCap[1].replace(",", "."));
    info.capMg = (mCap[2].toLowerCase() === "g") ? cap * 1000 : cap;
  }
  return info;
}

/* ================================================================
   Import d'une fiche (fusion par slug)
================================================================ */
function importMd(filename, md, logFn) {
  var parts = splitFiche(md);
  var fm = parts.fm, body = parts.body;
  var title = fm.titre || fm.title || filename.replace(/\.(md|markdown|txt)$/i, "").trim();
  var h1 = body.match(/^#\s+(.+)$/m);
  if ((!fm.titre && !fm.title) && h1) title = h1[1].trim();
  var slug = slugify(title);
  var tags = [];
  if (Array.isArray(fm.tags)) tags = fm.tags.slice();
  else if (fm.tags) tags = [String(fm.tags)];
  if (fm.categorie) tags.push(String(fm.categorie));
  var fiche = {
    id: slug, slug: slug, title: title, filename: filename,
    tags: tags, author: fm.author || "", created: fm.created || "", updated: fm.updated || "",
    md: body, html: mdToHtml(body), poso: extractPoso(body),
    text: norm(title + " " + tags.join(" ") + " " + body)
  };
  var replaced = false;
  for (var i = 0; i < fiches.length; i++) {
    if (fiches[i].slug === slug) { fiches[i] = fiche; replaced = true; break; }
  }
  if (!replaced) fiches.push(fiche);
  fiches.sort(function (a, b) { return a.title.localeCompare(b.title, "fr"); });
  return { fiche: fiche, replaced: replaced };
}

/* ================================================================
   Synchronisation GitHub
================================================================ */
function ghHeaders(raw) {
  var h = { Accept: raw ? "application/vnd.github.raw" : "application/vnd.github+json" };
  if (cfg.token && cfg.token.trim()) h.Authorization = "Bearer " + cfg.token.trim();
  return h;
}

async function syncGitHub(logFn, silent) {
  var user = (cfg.user || "").trim(), repo = (cfg.repo || "").trim();
  var branch = (cfg.branch || "main").trim(), folder = (cfg.folder || "").trim();
  if (!user || !repo) { if (!silent) logFn("⚠️ Renseignez au minimum l'utilisateur et le dépôt."); return; }
  logFn("Connexion au dépôt " + user + "/" + repo + " (branche " + branch + ")…");
  var url = "https://api.github.com/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo) +
    "/git/trees/" + encodeURIComponent(branch) + "?recursive=1";
  var r;
  try {
    r = await fetch(url, { headers: ghHeaders(false) });
  } catch (e) {
    logFn("❌ Impossible de joindre GitHub (réseau indisponible, ou aperçu dans un environnement sans réseau). " +
      "Le fichier téléchargé et ouvert depuis votre dossier fonctionne normalement.");
    return;
  }
  if (r.status === 404) { logFn("❌ Dépôt ou branche introuvable. Vérifiez l'utilisateur / dépôt / branche. Un dépôt PRIVÉ requiert un jeton."); return; }
  if (r.status === 401 || r.status === 403) { logFn("❌ Jeton invalide ou expiré (erreur " + r.status + ")."); return; }
  if (!r.ok) { logFn("❌ Erreur GitHub " + r.status); return; }
  var tree = (await r.json()).tree || [];
  var prefix = folder ? folder.replace(/^\/+|\/+$/g, "") + "/" : "";
  var files = tree.filter(function (t) {
    return t.type === "blob" && /\.md$/i.test(t.path) && t.path.indexOf(prefix) === 0 &&
      !/(^|\/)\.obsidian\//.test(t.path) && !/(^|\/)\.git\//.test(t.path);
  });
  if (!files.length) {
    logFn("⚠️ Aucun fichier .md trouvé" + (folder ? " dans « " + folder + " »" : "") + ".");
    return;
  }
  logFn(files.length + " fiche(s) détectée(s) — téléchargement…");
  var ok = 0, replaced = 0;
  for (var i = 0; i < files.length; i++) {
    var p = files[i].path;
    var rr = await fetch("https://api.github.com/repos/" + encodeURIComponent(user) + "/" + encodeURIComponent(repo) +
      "/contents/" + p.split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(branch),
      { headers: ghHeaders(true) });
    if (!rr.ok) { logFn("⚠️ Échec : " + p); continue; }
    var md = await rr.text();
    var name = p.split("/").pop();
    var res = importMd(name, md);
    if (res.replaced) replaced++;
    ok++;
    logFn("✅ " + name);
  }
  persistFiches();
  cfg.lastSync = new Date().toISOString();
  persistCfg();
  logFn("Synchronisation terminée : " + ok + " fiche(s) (" + replaced + " mise(s) à jour).");
  if (ok > 0 && !silent) toast("☁️ " + ok + " fiche(s) synchronisée(s)");
  render();
}

  applySchema();
}

function applySchema() {
  var selF = document.getElementById("calc-fiche"), selS = document.getElementById("calc-schema");
  if (!selF || !selS) return;
  var f = fiches.find(function (x) { return x.slug === selF.value; });
  var p = f.poso[parseInt(selS.value, 10)];
  var iDose = document.getElementById("calc-dose"), iFreq = document.getElementById("calc-freq"),
      iCap = document.getElementById("calc-cap"), iMode = document.getElementById("calc-mode");
  iDose.value = p.info.min || "";
  iFreq.value = p.info.freq || "";
  iCap.value = p.info.capMg || "";
  iMode.value = p.info.perRate
    ? (p.info.rateUnit === "mg" ? (p.info.ratePer === "min" ? "mgkgmin" : "mgkgh") : (p.info.ratePer === "min" ? "ugkgmin" : "ugkgh"))
    : (p.info.ugDay ? "ugkgjour" : (p.info.ugDose ? "ugkgdose" : (p.info.perM2 ? (p.info.perDose ? "m2prise" : "m2jour") : (p.info.perDose ? "prise" : "jour"))));
}

function computeDose() {
  var w = parseFloat((document.getElementById("calc-poids").value || "").replace(",", "."));
  var tEl = document.getElementById("calc-taille");
  var h = tEl ? parseFloat((tEl.value || "").replace(",", ".")) : NaN;
  var dose = parseFloat((document.getElementById("calc-dose").value || "").replace(",", "."));
  var freq = parseInt(document.getElementById("calc-freq").value || "0", 10);
  var cap = parseFloat((document.getElementById("calc-cap").value || "0").replace(",", "."));
  var mode = document.getElementById("calc-mode").value;
  var out = document.getElementById("calc-result");
  if (!w || w <= 0) { out.innerHTML = '<div class="warning-box">Saisissez le poids du patient.</div>'; return; }
  if (!dose || dose <= 0) { out.innerHTML = '<div class="warning-box">Saisissez la dose (mg/kg ou mg/m²).</div>'; return; }
  var isRate = (mode === "ugkgh" || mode === "mgkgh" || mode === "ugkgmin" || mode === "mgkgmin");
  var isUg = (mode === "ugkgjour" || mode === "ugkgdose");
  var perMin = (mode === "ugkgmin" || mode === "mgkgmin");
  var isM2 = (mode === "m2jour" || mode === "m2prise");
  var bsa = null;
  if (isM2) {
    if (!h || h <= 0) { out.innerHTML = '<div class="warning-box">Dose en mg/m² : saisissez aussi la taille du patient (surface corporelle, formule de Mosteller).</div>'; return; }
    bsa = Math.sqrt((w * h) / 3600);
  }
  var daily, perPrise, capped = false;
  var concEl = document.getElementById("calc-conc");
  var conc = concEl ? parseFloat((concEl.value || "").replace(",", ".")) : NaN;
  var mlH = null;
  if (isRate) {
    var rateVal = dose * w * (perMin ? 60 : 1); /* débit horaire, dans l'unité du mode (µg ou mg) */
    var rateMgH = (mode === "ugkgh" || mode === "ugkgmin") ? rateVal / 1000 : rateVal;
    daily = rateMgH * 24;
    perPrise = null;
    if (conc && conc > 0) mlH = rateMgH / conc;
  } else if (isUg) {
    if (mode === "ugkgjour") { daily = dose * w / 1000; perPrise = freq > 0 ? daily / freq : null; }
    else { perPrise = dose * w / 1000; daily = freq > 0 ? perPrise * freq : null; }
  } else if (isM2 && mode === "m2prise") {
    perPrise = dose * bsa;
    daily = freq > 0 ? perPrise * freq : null;
  } else if (isM2) {
    daily = dose * bsa;
    perPrise = freq > 0 ? daily / freq : null;
  } else if (mode === "prise") {
    perPrise = dose * w;
    daily = freq > 0 ? perPrise * freq : null;
  } else {
    daily = dose * w;
    perPrise = freq > 0 ? daily / freq : null;
  }
  if (cap && daily && daily > cap) { daily = cap; capped = true; perPrise = freq > 0 ? daily / freq : null; }
  var unitLabel = isRate ? ((mode === "ugkgh" || mode === "ugkgmin") ? "µg" : "mg") + "/kg/" + (perMin ? "min" : "h")
    : (isUg ? "µg/kg/" + (mode === "ugkgdose" ? "dose" : "jour")
    : (isM2 ? "mg/m²/" + (mode === "m2prise" ? "prise" : "jour") : "mg/kg/" + (mode === "prise" ? "prise" : "jour")));
  var html = '<div class="kpi-row">';
  if (isRate) {
    var rateTxt = (mode === "ugkgh" || mode === "ugkgmin")
      ? String(Math.round(rateVal * 100) / 100).replace(".", ",") + " µg/h (= " + String(Math.round(rateMgH * 1000) / 1000).replace(".", ",") + " mg/h)"
      : fmtMg(rateVal) + "/h";
    html += '<div class="kpi"><div class="v">' + rateTxt + '</div><div class="l">Débit de perfusion</div></div>';
  }
  if (daily !== null) html += '<div class="kpi"><div class="v">' + (isUg ? fmtUg(daily * 1000) : fmtMg(daily)) + '</div><div class="l">Dose totale / jour</div></div>';
  if (!isRate && perPrise !== null) html += '<div class="kpi"><div class="v">' + (isUg ? fmtUg(perPrise * 1000) : fmtMg(perPrise)) + '</div><div class="l">Dose par prise (' + freq + 'x/j)</div></div>';
  html += '<div class="kpi"><div class="v">' + String(dose).replace(".", ",") + " " + unitLabel + '</div><div class="l">Règle appliquée</div></div>';
  if (bsa !== null) html += '<div class="kpi"><div class="v">' + bsa.toFixed(2).replace(".", ",") + ' m²</div><div class="l">Surface corporelle (Mosteller)</div></div>';
  if (isRate && mlH) {
    html += '<div class="kpi"><div class="v">' + String(Math.round(mlH * 100) / 100).replace(".", ",") + ' mL/h</div><div class="l">Débit volumétrique (' + String(conc).replace(".", ",") + ' mg/mL)</div></div>';
    var dEl = document.getElementById("calc-duree");
    var duree = dEl ? parseFloat((dEl.value || "").replace(",", ".")) : 0;
    if (duree && duree > 0) {
      html += '<div class="kpi"><div class="v">' + String(Math.round(mlH * duree * 10) / 10).replace(".", ",") + ' mL</div><div class="l">Volume pour ' + String(duree).replace(".", ",") + ' h</div></div>';
    }
  }
  html += "</div>";
  html += '<p class="formula">' + (isRate
      ? "débit = " + dose + " " + ((mode === "ugkgh" || mode === "ugkgmin") ? "µg" : "mg") + "/kg/" + (perMin ? "min" : "h") + " × " + w + " kg" + (perMin ? " × 60 min/h" : "") + (mlH ? " → " + String(Math.round(mlH * 100) / 100).replace(".", ",") + " mL/h (" + String(conc).replace(".", ",") + " mg/mL)" : "")
      : (isUg ? (mode === "ugkgdose" ? "prise = " : "jour = ") + dose + " µg/kg × " + w + " kg"
      : (isM2 ? (mode === "m2prise" ? "prise = " : "jour = ") + dose + " mg/m² × " + bsa.toFixed(2) + " m² (SC = √(" + w + " kg × " + h + " cm / 3600))"
      : (mode === "prise" ? "prise = " : "jour = ") + dose + " mg/kg × " + w + " kg"))) +
    (capped ? " → plafonné au maximum : " + cap + " mg/j" : "") + "</p>";
  if (capped) html += '<div class="warning-box">⚠️ Dose maximale atteinte : le total journalier est plafonné.</div>';
  out.innerHTML = html;
}

/* ---------- Import ---------- */
function renderImport() {
  var lastSync = cfg.lastSync ? new Date(cfg.lastSync).toLocaleString("fr-BE") : "jamais";
  var html = '<div class="card"><div class="section-title">📥 Importer des fiches</div>';
  html += '<p style="margin-top:0;color:var(--muted)">Formats acceptés : fichiers <code>.md</code> avec frontmatter YAML (format des fiches du coffre Obsidian).</p>';
  /* Fichiers */
  html += "<h3>Depuis des fichiers</h3>";
  html += '<div class="dropzone" id="dropzone">📁 Cliquez ou glissez-déposez ici vos fichiers .md<br/>' +
    '<span style="font-size:12px">(sélection multiple possible)</span></div>';
  html += '<input type="file" id="file-input" accept=".md,.markdown,.txt" multiple style="display:none"/>';
  /* Coller */
  html += "<h3>Depuis le presse-papiers</h3>";
  html += "<label>Collez le contenu d'une fiche (markdown)</label>";
  html += '<textarea id="paste-area" rows="5" placeholder="---\ncréé : 2026-10-20\n…"></textarea>';
  html += '<div style="display:flex;gap:8px;margin-top:10px">' +
    '<input type="text" id="paste-name" placeholder="Nom du médicament (ex : Amoxicilline-clavulanate)"/>' +
    '<button class="btn btn-primary" onclick="importPaste()">Ajouter</button></div>';
  html += "</div>";

  /* Carte GitHub */
  html += '<div class="card"><div class="section-title">☁️ Synchronisation GitHub</div>';
  html += '<p style="margin-top:0;color:var(--muted)">Architecture : le coffre Obsidian est poussé automatiquement vers GitHub ' +
    "(plugiciel Git) ; l'application récupère ici les fiches du dépôt. Ajouter une fiche dans Obsidian → " +
    "elle apparaît ici après synchronisation.</p>";
  html += '<div class="grid2">' +
    "<div><label>Utilisateur GitHub</label><input type='text' id='gh-user' value='" + esc(cfg.user) + "'/></div>" +
    "<div><label>Dépôt</label><input type='text' id='gh-repo' value='" + esc(cfg.repo) + "'/></div>" +
    "<div><label>Branche</label><input type='text' id='gh-branch' value='" + esc(cfg.branch) + "'/></div>" +
    "<div><label>Dossier (vide = racine)</label><input type='text' id='gh-folder' value='" + esc(cfg.folder) + "' placeholder='ex : fiches'/></div>" +
    "</div>";
  html += "<label>Jeton GitHub (requis pour un dépôt privé — lecture seule)</label>" +
    "<input type='password' id='gh-token' value='" + esc(cfg.token) + "' placeholder='github_pat_…'/>";
  html += "<p class='field-note'>Le jeton reste stocké uniquement sur cet appareil. Créer un jeton : GitHub → Settings → Developer settings → Personal access tokens → fine-grained, accès au seul dépôt, permission Contents : Read-only.</p>";
  html += '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px">' +
    '<button class="btn btn-primary" id="gh-sync-btn" onclick="runSync()">☁️ Synchroniser maintenant</button>' +
    '<label style="display:flex;align-items:center;gap:6px;margin:0;font-size:13.5px;cursor:pointer">' +
    '<input type="checkbox" id="gh-auto"' + (cfg.autoSync ? " checked" : "") + ' style="width:auto"/> Synchroniser au démarrage</label>' +
    '<span style="font-size:12px;color:var(--muted)">Dernière synchro : ' + esc(lastSync) + "</span></div>";
  html += '<label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;cursor:pointer">' +
    '<input type="checkbox" id="gh-replace" style="width:auto"/> Remplacer toute la collection (sinon, fusion par nom de fiche)</label>';
  html += '<div class="log" id="gh-log"></div>';
  html += "</div>";

  /* Version autonome (iPhone) */
  html += '<div class="card"><div class="section-title">📦 Version autonome (iPhone)</div>';
  html += "<p style='margin-top:0;color:var(--muted)'>iOS efface parfois le stockage local des apps web (fiches et jeton disparaissent). Deux parades :</p>";
  html += "<ol><li><strong>App avec fiches intégrées</strong> : le fichier exporté contient vos fiches — il fonctionne toujours, même hors ligne, sans jeton ni synchronisation.</li>" +
    "<li><strong>Lien de configuration</strong> : le jeton est encodé dans le lien ; recréez l&rsquo;icône iPhone avec ce lien — même après un effacement du stockage, l&rsquo;app se reconfigure et resynchronise seule au lancement.</li></ol>";
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn btn-primary" onclick="exportApp()">📤 Exporter l&rsquo;app avec fiches intégrées (index.html)</button>' +
    '<button class="btn" onclick="makeSetupLink()">🔗 Générer le lien de configuration iPhone</button>' +
    "</div>";
  html += '<div id="setup-link-out"></div>';
  html += "<p class='field-note'>⚠️ Le fichier exporté contient vos fiches : ne le publiez que si elles peuvent être lues publiquement. Publication : sur GitHub (dépôt <em>fiches-app</em>) → <em>Add file → Upload files</em> → remplacer <code>index.html</code> → <em>Commit changes</em> — l&rsquo;URL GitHub Pages reste identique.</p>";
  html += "</div>";

  /* Gestion des données */
  html += '<div class="card"><div class="section-title">🗄️ Données locales</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn" onclick="exportData()">⬇️ Exporter (sauvegarde JSON)</button>' +
    '<button class="btn btn-danger" onclick="wipeAll()">🗑️ Tout effacer</button></div>';
  html += '<p class="field-note">Les fiches importées sont conservées sur cet appareil (stockage local du navigateur) — ' +
    "l'application fonctionne ensuite hors ligne.</p>";
  html += '<p class="field-note">💡 Astuce : dans un aperçu intégré (Vibe), l&rsquo;accès réseau peut être bloqué — le fichier téléchargé ' +
    "et ouvert depuis votre coffre fonctionne normalement.</p>";
  html += "</div>";

  view.innerHTML = html;

  var dz = document.getElementById("dropzone"), fi = document.getElementById("file-input");
  dz.addEventListener("click", function () { fi.click(); });
  dz.addEventListener("dragover", function (e) { e.preventDefault(); dz.classList.add("drag"); });
  dz.addEventListener("dragleave", function () { dz.classList.remove("drag"); });
  dz.addEventListener("drop", function (e) {
    e.preventDefault(); dz.classList.remove("drag");
    handleFiles(e.dataTransfer.files);
  });
  fi.addEventListener("change", function () { handleFiles(fi.files); });
  ["gh-user", "gh-repo", "gh-branch", "gh-folder", "gh-token"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", readGhForm);
  });
  document.getElementById("gh-auto").addEventListener("change", function () {
    readGhForm();
    toast(cfg.autoSync ? "Synchronisation au démarrage activée" : "Synchronisation au démarrage désactivée");
  });
}

function readGhForm() {
  cfg.user = document.getElementById("gh-user").value;
  cfg.repo = document.getElementById("gh-repo").value;
  cfg.branch = document.getElementById("gh-branch").value || "main";
  cfg.folder = document.getElementById("gh-folder").value;
  cfg.token = document.getElementById("gh-token").value;
  cfg.autoSync = document.getElementById("gh-auto").checked;
  persistCfg();
}

function runSync() {
  readGhForm();
  var logEl = document.getElementById("gh-log");
  var btn = document.getElementById("gh-sync-btn");
  if (document.getElementById("gh-replace").checked) { fiches = []; persistFiches(); }
  logEl.style.display = "block";
  logEl.textContent = "";
  var log = function (m) { logEl.textContent += m + "\n"; logEl.scrollTop = logEl.scrollHeight; };
  btn.disabled = true;
  syncGitHub(log, false).then(function () { btn.disabled = false; });
}

function handleFiles(fileList) {
  var files = Array.prototype.slice.call(fileList).filter(function (f) { return /\.(md|markdown|txt)$/i.test(f.name); });
  if (!files.length) { toast("⚠️ Aucun fichier .md trouvé"); return; }
  var done = 0, added = 0;
  files.forEach(function (f) {
    var reader = new FileReader();
    reader.onload = function () {
      var res = importMd(f.name, String(reader.result));
      done++; if (!res.replaced) added++;
      if (done === files.length) { persistFiches(); toast("✅ " + added + " fiche(s) ajoutée(s), " + (files.length - added) + " mise(s) à jour"); renderImport(); }
    };
    reader.readAsText(f);
  });
}

function importPaste() {
  var md = document.getElementById("paste-area").value.trim();
  var name = document.getElementById("paste-name").value.trim() || "fiche-collee.md";
  if (!md) { toast("⚠️ Collez d'abord le contenu d'une fiche"); return; }
  if (!/\.md$/i.test(name)) name += ".md";
  var res = importMd(name, md);
  persistFiches();
  toast(res.replaced ? "✅ Fiche mise à jour" : "✅ Fiche ajoutée");
  document.getElementById("paste-area").value = "";
  document.getElementById("paste-name").value = "";
}

function exportData() {
  var data = { fiches: fiches, cfg: cfg, favs: favs, exported: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fiches-medicaments-sauvegarde.json";
  document.body.appendChild(a); a.click(); a.remove();
}

function exportApp() {
  if (!fiches.length) { toast("⚠️ Aucune fiche à intégrer — synchronisez d'abord."); return; }
  var slim = fiches.map(function (f) {
    var md = "---\n";
    if (f.title) md += "titre: " + f.title + "\n";
    if (f.author) md += "author: " + f.author + "\n";
    if (f.created) md += "created: " + f.created + "\n";
    if (f.updated) md += "updated: " + f.updated + "\n";
    if (f.tags.length) { md += "tags:\n"; f.tags.forEach(function (t) { md += "  - " + t + "\n"; }); }
    md += "---\n" + f.md;
    return { filename: f.filename || (f.slug + ".md"), md: md };
  });
  var clone = document.documentElement.cloneNode(true);
  var v = clone.querySelector("#view"); if (v) v.innerHTML = "";
  var tEl = clone.querySelector("#toast"); if (tEl) { tEl.textContent = ""; tEl.style.display = "none"; }
  var pEl = clone.querySelector("#count-pill"); if (pEl) pEl.textContent = "";
  var ins = clone.querySelectorAll("input, textarea");
  for (var i = 0; i < ins.length; i++) { try { ins[i].removeAttribute("value"); } catch (e) {} }
  var firstScript = clone.querySelector("script");
  var dataScript = document.createElement("script");
  dataScript.textContent = "window.EMBEDDED_FICHES = " + JSON.stringify(slim) + ";";
  if (firstScript && firstScript.parentNode) { firstScript.parentNode.insertBefore(dataScript, firstScript); }
  else { clone.querySelector("body").appendChild(dataScript); }
  var htmlOut = "<!doctype html>\n" + clone.outerHTML;
  var blob = new Blob([htmlOut], { type: "text/html;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  toast("✅ App exportée avec " + slim.length + " fiche(s) intégrée(s)");
}

function makeSetupLink() {
  readGhForm();
  var token = (cfg.token || "").trim();
  var out = document.getElementById("setup-link-out");
  if (!out) return;
  if (!token) {
    out.innerHTML = "<div class='warning-box'>Renseignez d&rsquo;abord le jeton dans la carte ☁️ ci-dessus.</div>";
    return;
  }
  var base = window.location.href.split("#")[0];
  var link = base + "#setup=" + encodeURIComponent(token);
  out.innerHTML = "<label>Lien de configuration (à ouvrir sur iPhone)</label>" +
    "<input type='text' readonly value='" + esc(link) + "' onclick='this.select()'/>" +
    "<p class='field-note'>Sur iPhone : ouvrez ce lien dans Safari → l&rsquo;app enregistre le jeton et la synchronisation automatique → puis Safari → Partager → « Sur l&rsquo;écran d&rsquo;accueil » pour recréer l&rsquo;icône. Ce lien contient votre jeton : ne le partagez pas.</p>";
}

function wipeAll() {
  if (!confirm("Effacer toutes les fiches et réglages de cet appareil ?")) return;
  fiches = []; favs = []; recents = [];
  cfg.token = "";
  persistFiches(); persistCfg(); saveLs(LS.fav, favs); saveLs(LS.rec, recents);
  toast("Données effacées");
  render();
}

/* ================================================================
   Démarrage
================================================================ */
document.getElementById("quick-sync").addEventListener("click", function () {
  window.location.hash = "#/import";
  setTimeout(runSync, 60);
});
window.addEventListener("hashchange", render);

/* Récupération du jeton depuis un lien de configuration (#setup=…) */
var setupMatch = (window.location.hash || "").match(/^#setup=(.+)$/);
if (setupMatch) {
  cfg.token = decodeURIComponent(setupMatch[1]);
  cfg.autoSync = true;
  persistCfg();
  try { window.location.hash = "#/"; } catch (e) {}
}

/* Fiches intégrées (version autonome) : base hors ligne si stockage vide */
if (!fiches.length && EMBEDDED_FICHES.length) {
  for (var ei = 0; ei < EMBEDDED_FICHES.length; ei++) {
    var recEmb = EMBEDDED_FICHES[ei];
    importMd(recEmb.filename || "fiche.md", recEmb.md || "");
  }
  persistFiches();
}

render();
updateCount();
if (cfg.autoSync) {
  var silentLog = function () {};
  syncGitHub(silentLog, true);
}
</script>
